 i versi sono endecasillabi e le rime sono incatenate (ABA BCB CDC…)."],["cantica","Ciascuna delle tre grandi parti della Commedia: Inferno, Purgatorio e Paradiso."],["priore","Nella Firenze del tempo, uno dei magistrati che governavano il Comune per due mesi."]],capsules:[{key:"giovinezza",type:"period",title:"Gli anni fiorentini",date:"1265..1301",cats:["vita"],text:"<p>Dante vive a Firenze, studia, scrive le prime poesie e partecipa alla vita politica del Comune.</p>",showPeriodCapsule:!1},{key:"esilio-periodo",type:"period",title:"L’esilio",date:"1302..1321",cats:["vita"],text:"<p>Condannato e lontano da Firenze, Dante vive ospite di diverse corti dell’Italia settentrionale e compone le opere maggiori.</p>",showPeriodCapsule:!1},{key:"nascita",type:"event",title:"Nascita a Firenze",date:"1265",cats:["vita"],essential:!0,text:"<p><strong>Durante</strong> di Alighiero degli Alighieri, detto <strong>Dante</strong>, nasce a Firenze in una famiglia della piccola nobiltà cittadina, di parte guelfa. Il giorno preciso non è noto: probabilmente tra maggio e giugno.</p>",place:{name:"Firenze",lat:43.7696,lon:11.2558,zoom:13},links:[{label:"Dante Alighieri su Wikipedia",url:"https://it.wikipedia.org/wiki/Dante_Alighieri"}]},{key:"beatrice",type:"event",title:"Il primo incontro con Beatrice",date:"~1274",cats:["vita"],text:"<p>Secondo quanto Dante racconta nella <em>Vita nuova</em>, a nove anni vede per la prima volta Beatrice, tradizionalmente identificata con Bice Portinari. Per lui diventerà il simbolo dell’amore che eleva l’animo.</p>"},{key:"campaldino",type:"event",title:"La battaglia di Campaldino",date:"1289-06-11",cats:["firenze"],text:"<p>Dante combatte tra i cavalieri fiorentini nella battaglia in cui i guelfi di Firenze sconfiggono i ghibellini di Arezzo.</p>"},{key:"morte-beatrice",type:"event",title:"La morte di Beatrice",date:"1290",cats:["vita"],text:"<p>Beatrice muore giovanissima. Il dolore per questa perdita è al centro della <em>Vita nuova</em>.</p>"},{key:"vita-nuova",type:"event",title:"La Vita nuova",date:"~1292..1295",cats:["opere"],essential:!0,text:"<p>Opera in <strong>prosa e versi</strong> che racconta l’amore per Beatrice. Contiene alcune delle poesie più celebri di Dante, come il sonetto «Tanto gentile e tanto onesta pare».</p>"},{key:"priore",type:"event",title:"Priore di Firenze",date:"1300-06-15..1300-08-15",cats:["firenze"],text:"<p>Dopo alcuni anni di impegno politico, per due mesi Dante è uno dei <strong>priori</strong>, i magistrati che governano il Comune. In quegli anni i guelfi fiorentini sono divisi tra <strong>Bianchi</strong>, a cui Dante appartiene, e <strong>Neri</strong>.</p>"},{key:"condanna",type:"event",title:"La condanna all’esilio",date:"1302-01-27",cats:["firenze","vita"],essential:!0,text:"<p>Mentre Dante è lontano dalla città, i Neri prendono il potere. Viene condannato a una multa, a due anni di confino e all’esclusione perpetua dai pubblici uffici; poche settimane dopo, il 10 marzo, viene condannato a <strong>morte</strong> nel caso in cui torni a Firenze. Non la rivedrà più.</p>"},{key:"domanda-esilio",type:"question",title:"Perché l’esilio?",cats:["firenze"],mode:"quiz",blocking:!0,text:"<p>Qual è la causa principale dell’esilio di Dante?</p>",options:[["I guelfi Neri prendono il potere a Firenze e condannano i Bianchi",!0],["Dante aveva criticato il papa nella Commedia già pubblicata",!1],["Dante aveva combattuto contro Firenze a Campaldino",!1],["Dante voleva trasferirsi alla corte di Verona",!1]],hint:"<p>Rileggi le capsule «Priore di Firenze» e «La condanna all’esilio»: a quale parte apparteneva Dante?</p>",answer:"<p>Dante apparteneva ai guelfi <strong>Bianchi</strong>. Quando i <strong>Neri</strong> presero il potere, i Bianchi furono condannati e allontanati dalla città.</p>"},{key:"trattati",type:"event",title:"Convivio e De vulgari eloquentia",date:"~1303..1308",cats:["opere"],text:"<p>Nei primi anni dell’esilio Dante scrive due trattati, rimasti incompiuti: il <strong>Convivio</strong>, in volgare, per offrire il sapere anche a chi non conosce il latino, e il <strong>De vulgari eloquentia</strong>, in latino, dedicato alla lingua volgare e alla poesia.</p>"},{key:"commedia",type:"event",title:"La Commedia",date:"~1304..1321",cats:["opere"],essential:!0,text:"<p>Il poema racconta il viaggio immaginario di Dante nei tre regni dell’aldilà, ambientato nella primavera del <strong>1300</strong>. È diviso in tre cantiche e cento canti, scritti in <strong>terzine</strong> di endecasillabi. L’aggettivo «Divina» fu aggiunto più tardi: lo usò Giovanni Boccaccio e comparve nel titolo di un’edizione del 1555.</p>",image:{src:"commedia",alt:"Schema delle tre cantiche: Inferno a imbuto, Purgatorio a montagna, Paradiso a cieli concentrici",caption:"Le tre cantiche della Commedia",source:"Illustrazione del modello CronoLab"},links:[{label:"La Divina Commedia su Wikipedia",url:"https://it.wikipedia.org/wiki/Divina_Commedia"}]},{key:"verona",type:"event",title:"A Verona da Cangrande della Scala",date:"~1312..1318",cats:["vita"],text:"<p>Durante l’esilio Dante è ospite di diverse corti. Soggiorna a lungo a Verona presso <strong>Cangrande della Scala</strong>, signore della città, che ricorda con gratitudine nella Commedia.</p>",place:{name:"Verona",lat:45.4384,lon:10.9916,zoom:13}},{key:"ravenna",type:"event",title:"Gli ultimi anni e la morte a Ravenna",date:"1321-09-14",cats:["vita"],essential:!0,text:"<p>Negli ultimi anni Dante vive a Ravenna, ospite di Guido Novello da Polenta. Muore nella notte tra il 13 e il 14 settembre 1321, al ritorno da un’ambasceria a Venezia, poco dopo aver concluso il Paradiso. È sepolto a Ravenna.</p>",place:{name:"Tomba di Dante, Ravenna",lat:44.4166,lon:12.1992,zoom:15}},{key:"volgare",type:"note",title:"Perché Dante scrive in volgare?",cats:["opere"],text:"<p>Nel Medioevo le opere importanti si scrivevano in latino. Dante sceglie il <strong>volgare fiorentino</strong> per la Commedia perché vuole essere capito da molti lettori. Il successo del poema contribuì a fare del fiorentino la base della lingua italiana.</p>"},{key:"ordine",type:"question",title:"Le tappe della vita di Dante",cats:["vita"],mode:"ordering",text:"<p>Metti in ordine cronologico queste tappe della vita di Dante.</p>",order:["Nascita a Firenze","Battaglia di Campaldino","Priore di Firenze","Condanna all’esilio","Morte a Ravenna"],hint:"<p>Guarda le date nelle capsule della linea del tempo.</p>",answer:"<p>1265 nascita · 1289 Campaldino · 1300 priorato · 1302 condanna · 1321 morte a Ravenna.</p>"},{key:"cloze",type:"question",title:"Com’è fatta la Commedia?",cats:["opere"],mode:"cloze",clozeMode:"select",cloze:"<p>La Commedia è divisa in tre [[cantiche|capitoli|libri]]: Inferno, Purgatorio e [[Paradiso|Limbo|Eden]]. In tutto conta [[100|99|33]] canti, scritti in [[terzine|quartine|ottave]] di endecasillabi. Il viaggio è ambientato nell’anno [[1300|1265|1321]].</p>",hint:"<p>Apri la capsula «La Commedia» e osserva lo schema delle tre cantiche.</p>",answer:"<p>Tre cantiche, cento canti in terzine; il viaggio si svolge nel 1300.</p>"},{key:"abbinamenti",type:"question",title:"Le opere di Dante",cats:["opere"],mode:"matching",text:"<p>Abbina ogni opera alla sua descrizione.</p>",pairs:[["Vita nuova","L’amore per Beatrice, in prosa e versi"],["Convivio","Trattato in volgare per diffondere il sapere"],["De vulgari eloquentia","Trattato in latino sulla lingua volgare"],["Commedia","Poema in cento canti sul viaggio nell’aldilà"]],answer:"<p>Dante usa il latino per il trattato sulla lingua volgare, rivolto ai dotti, e il volgare per le altre tre opere dell’esercizio.</p>"},{key:"vero-falso",type:"question",title:"Vero o falso su Dante",cats:["vita"],mode:"truefalse",text:"<p>Indica se le affermazioni sono vere o false.</p>",statements:[["Dante nasce a Ravenna.",!1],["Dopo la condanna del 1302 Dante non tornò più a Firenze.",!0],["Il viaggio della Commedia è ambientato nel 1300.",!0],["La Commedia è scritta in latino.",!1]],answer:"<p>Dante nasce a Firenze e muore a Ravenna; la Commedia è scritta in volgare fiorentino.</p>"}],links:[{from:"condanna",to:"esilio-periodo",fromLabel:"Vai al periodo dell’esilio",toLabel:"Rileggi la condanna",both:!0},{from:"volgare",to:"commedia",fromLabel:"Vai alla Commedia",toLabel:"Perché in volgare?",both:!0}]},{key:"periodo",label:"Periodo storico: cause, eventi, conseguenze",topic:"Le grandi scoperte geografiche",subject:"Storia",description:"Un periodo raccontato in tre parti: perché avviene, che cosa succede e che cosa cambia dopo.",project:{title:"Le grandi scoperte geografiche",subtitle:"Cause, viaggi e conseguenze: il mondo si allarga tra Quattrocento e Cinquecento",introLabel:"Come usare questa linea",introduction:"Le categorie dividono la linea in tre parti: Cause, Viaggi ed esplorazioni, Conseguenze. Usa i filtri in alto per seguirne una alla volta, oppure apri la Visione sincronica per vederle in parallelo.",author:"Modello CronoLab",className:"Classe seconda",subject:"Storia",theme:"notebook",accent:"#0369a1",defaultOrientation:"horizontal",defaultScale:"proportional"},categories:[{key:"cause",name:"Cause",color:"#b45309"},{key:"viaggi",name:"Viaggi ed esplorazioni",color:"#0369a1"},{key:"conseguenze",name:"Conseguenze",color:"#7f2c40"}],glossary:[["spezie","Sostanze vegetali come pepe, cannella e noce moscata, usate per insaporire e conservare i cibi. In Europa erano rare e costosissime."],["caravella","Nave leggera e veloce, con vele quadre e triangolari, adatta a navigare anche con il vento contrario."],["astrolabio","Strumento che misura l’altezza degli astri e aiuta a calcolare la latitudine."],["circumnavigazione","Viaggio intorno a qualcosa: la prima circumnavigazione del globo fu completata nel 1522."],["colonia","Territorio conquistato e governato da uno Stato lontano, che ne sfrutta le risorse."],["conquistadores","I soldati e gli avventurieri spagnoli che conquistarono le Americhe nel Cinquecento."]],capsules:[{key:"portoghesi",type:"period",title:"Le esplorazioni portoghesi lungo l’Africa",date:"1415..1498",cats:["viaggi"],showPeriodCapsule:!1,text:"<p>Il Portogallo esplora le coste africane per raggiungere l’Oriente circumnavigando il continente.</p>"},{key:"spagnoli",type:"period",title:"I viaggi verso ovest",date:"1492..1522",cats:["viaggi"],showPeriodCapsule:!1,text:"<p>La Spagna finanzia i viaggi attraverso l’Atlantico, fino alla prima circumnavigazione del globo.</p>"},{key:"ceuta",type:"event",title:"La conquista di Ceuta",date:"1415",cats:["cause","viaggi"],text:"<p>Con la conquista della città di Ceuta, sulla costa africana dello stretto di Gibilterra, il <strong>Portogallo</strong> inizia la sua espansione oltremare.</p>"},{key:"costantinopoli",type:"event",title:"I Turchi conquistano Costantinopoli",date:"1453-05-29",cats:["cause"],essential:!0,text:"<p>Con la caduta di Costantinopoli, i <strong>Turchi ottomani</strong> controllano le vie commerciali tra Europa e Asia. Le spezie diventano ancora più care: cercare una nuova strada per l’Oriente diventa urgente.</p>",place:{name:"Istanbul (Costantinopoli)",lat:41.0082,lon:28.9784,zoom:11}},{key:"tecnologie",type:"note",title:"Navigare in mare aperto",cats:["cause"],essential:!0,text:"<p>Le esplorazioni sono possibili grazie a navi e strumenti migliori:</p><ul><li>la <strong>caravella</strong>, leggera e manovrabile;</li><li>la <strong>bussola</strong>, che indica il nord;</li><li>l’<strong>astrolabio</strong>, per calcolare la latitudine;</li><li>carte nautiche sempre più precise.</li></ul>"},{key:"domanda-cause",type:"question",title:"Perché partire?",cats:["cause"],mode:"quiz",blocking:!0,text:"<p>Quali furono le cause delle grandi esplorazioni? Seleziona tutte le risposte corrette.</p>",options:[["Trovare una nuova via per il commercio delle spezie",!0],["Aggirare i Turchi, che controllavano le vie verso l’Oriente",!0],["Dimostrare che la Terra era rotonda",!1],["Fuggire da una pestilenza che colpiva tutta l’Europa",!1]],hint:"<p>Attenzione: le persone istruite sapevano già da secoli che la Terra è sferica.</p>",answer:"<p>Le cause principali furono <strong>economiche</strong> (le spezie e i commerci) e <strong>politiche</strong> (l’avanzata ottomana), rese possibili dai progressi nella navigazione.</p>"},{key:"diaz",type:"event",title:"Bartolomeo Diaz doppia il Capo di Buona Speranza",date:"1488",cats:["viaggi"],text:"<p>Il navigatore portoghese doppia l’estremità meridionale dell’Africa: si apre la strada per l’oceano Indiano.</p>",place:{name:"Capo di Buona Speranza",lat:-34.3568,lon:18.474,zoom:9}},{key:"colombo",type:"event",title:"Cristoforo Colombo arriva in America",date:"1492-10-12",cats:["viaggi"],essential:!0,text:"<p>Partito il 3 agosto da Palos con tre navi finanziate dai sovrani di Spagna, Colombo vuole raggiungere l’Asia navigando verso ovest. Il 12 ottobre sbarca su un’isola delle Bahamas: è convinto di essere arrivato nelle Indie.</p>",place:{name:"Palos de la Frontera (partenza)",lat:37.2285,lon:-6.8932,zoom:12},links:[{label:"Cristoforo Colombo su Wikipedia",url:"https://it.wikipedia.org/wiki/Cristoforo_Colombo"}]},{key:"tordesillas",type:"event",title:"Il trattato di Tordesillas",date:"1494-06-07",cats:["viaggi","conseguenze"],text:"<p>Spagna e Portogallo si dividono le terre scoperte e da scoprire con una linea immaginaria nell’oceano Atlantico: a ovest la Spagna, a est il Portogallo. Per questo in Brasile oggi si parla portoghese.</p>",links:[{label:"Il trattato di Tordesillas su Wikipedia",url:"https://it.wikipedia.org/wiki/Trattato_di_Tordesillas"}]},{key:"gama",type:"event",title:"Vasco da Gama raggiunge l’India",date:"1498-05-20",cats:["viaggi"],essential:!0,text:"<p>Circumnavigando l’Africa, Vasco da Gama arriva a <strong>Calicut</strong>, in India. Il Portogallo ha trovato la via marittima per le spezie.</p>",place:{name:"Calicut (Kozhikode), India",lat:11.2588,lon:75.7804,zoom:11}},{key:"cabral",type:"event",title:"Cabral arriva in Brasile",date:"1500-04-22",cats:["viaggi"],text:"<p>Il portoghese Pedro Álvares Cabral, diretto in India, tocca le coste del Brasile, che diventa una colonia portoghese.</p>"},{key:"america",type:"event",title:"Il nome «America»",date:"1507",cats:["viaggi"],text:"<p>Il navigatore fiorentino <strong>Amerigo Vespucci</strong> sostiene che le terre raggiunte da Colombo siano un continente nuovo. Nel 1507 il cartografo Martin Waldseemüller lo chiama «America» in suo onore.</p>"},{key:"magellano",type:"event",title:"Il primo giro del mondo",date:"1519-09-20..1522-09-06",cats:["viaggi"],essential:!0,text:"<p>La spedizione guidata da <strong>Ferdinando Magellano</strong> attraversa l’Atlantico e il Pacifico. Magellano muore nelle Filippine nel 1521; una sola nave, guidata da Juan Sebastián Elcano, torna in Spagna nel 1522 completando la prima circumnavigazione del globo.</p>"},{key:"aztechi",type:"event",title:"La conquista dell’impero azteco",date:"1519..1521",cats:["conseguenze"],text:"<p>Il conquistador <strong>Hernán Cortés</strong> sottomette l’impero azteco; la capitale Tenochtitlán cade nel 1521. Sulle sue rovine nasce Città del Messico.</p>"},{key:"inca",type:"event",title:"La conquista dell’impero inca",date:"1532..1533",cats:["conseguenze"],text:"<p><strong>Francisco Pizarro</strong> cattura l’imperatore Atahualpa e conquista l’impero inca, nelle Ande.</p>"},{key:"scambio",type:"note",title:"Lo scambio colombiano",cats:["conseguenze"],essential:!0,text:"<p>Tra i due continenti viaggiano piante, animali e malattie:</p><ul><li>dall’America all’Europa arrivano <strong>mais, patata, pomodoro, cacao</strong>;</li><li>dall’Europa all’America arrivano <strong>cavalli, bovini, grano</strong>;</li><li>le malattie europee, come il <strong>vaiolo</strong>, causano la morte di gran parte delle popolazioni native.</li></ul>",links:[{label:"Lo scambio colombiano su Wikipedia",url:"https://it.wikipedia.org/wiki/Scambio_colombiano"}]},{key:"atlantico",type:"note",title:"Il centro dei commerci si sposta sull’Atlantico",cats:["conseguenze"],text:"<p>Crescono i porti affacciati sull’oceano, come Lisbona, Siviglia e Anversa. Venezia e Genova, che dominavano i commerci del Mediterraneo, perdono a poco a poco importanza.</p>"},{key:"tratta",type:"note",title:"La tratta degli schiavi",cats:["conseguenze"],text:"<p>Per lavorare nelle piantagioni e nelle miniere americane, dal Cinquecento milioni di africani vengono deportati in America come schiavi: è una delle pagine più tragiche della storia.</p>"},{key:"vf",type:"question",title:"Vero o falso sui viaggi",cats:["viaggi"],mode:"truefalse",text:"<p>Indica se le affermazioni sono vere o false.</p>",statements:[["Colombo pensava di essere arrivato in Asia.",!0],["Il trattato di Tordesillas divise le nuove terre tra Spagna e Portogallo.",!0],["Magellano completò personalmente il giro del mondo.",!1],["Vasco da Gama raggiunse l’India circumnavigando l’Africa.",!0]],answer:"<p>Magellano morì nelle Filippine: il viaggio fu completato da Juan Sebastián Elcano.</p>"},{key:"ordine",type:"question",title:"In ordine di tempo",cats:["viaggi"],mode:"ordering",text:"<p>Metti in ordine cronologico questi eventi.</p>",order:["Diaz doppia il Capo di Buona Speranza","Colombo arriva in America","Trattato di Tordesillas","Vasco da Gama raggiunge l’India","Primo giro del mondo"],answer:"<p>1488 · 1492 · 1494 · 1498 · 1519–1522.</p>"},{key:"esploratori",type:"question",title:"Chi ha fatto che cosa?",cats:["viaggi"],mode:"matching",text:"<p>Abbina ogni esploratore alla sua impresa.</p>",pairs:[["Bartolomeo Diaz","Doppia il Capo di Buona Speranza"],["Cristoforo Colombo","Raggiunge l’America navigando verso ovest"],["Vasco da Gama","Raggiunge l’India per mare"],["Ferdinando Magellano","Guida la spedizione del primo giro del mondo"]]},{key:"riflessione",type:"question",title:"Che cosa cambia?",cats:["conseguenze"],mode:"open",text:"<p>Spiega con parole tue che cos’è lo «scambio colombiano» e fai due esempi, uno per ogni direzione.</p>",answer:"<p>È il passaggio di piante, animali e malattie tra America ed Europa dopo il 1492. Esempi: il <strong>pomodoro</strong> e la patata arrivano in Europa; il <strong>cavallo</strong> e il grano arrivano in America. Le malattie europee causano una terribile mortalità tra i nativi.</p>"}],links:[{from:"costantinopoli",to:"gama",fromLabel:"Vedi la nuova via per l’India",toLabel:"Perché serviva una nuova via?",both:!0},{from:"colombo",to:"scambio",fromLabel:"Le conseguenze: lo scambio colombiano",toLabel:"Torna al viaggio di Colombo",both:!0}]},{key:"confronto",label:"Confronto tra due civiltà",topic:"Bizantini e Arabi",subject:"Storia",description:"Due civiltà sulla stessa linea del tempo, da confrontare anche con la Visione sincronica.",project:{title:"Bizantini e Arabi: due civiltà a confronto",subtitle:"Dal IV al XV secolo, tra Costantinopoli, Damasco e Baghdad",introLabel:"Come usare questa linea",introduction:"Le categorie distinguono le due civiltà e i loro incontri: usa i filtri in alto per vederne una sola, oppure apri la Visione sincronica dal menu Vista per vedere Bizantini e Arabi in corsie parallele. Così è più facile capire che cosa accadeva nello stesso momento.",author:"Modello CronoLab",className:"Classe prima",subject:"Storia",theme:"essential",accent:"#0f766e",defaultOrientation:"horizontal",defaultScale:"sequence"},categories:[{key:"bizantini",name:"Impero bizantino",color:"#1d4ed8"},{key:"arabi",name:"Mondo arabo-islamico",color:"#0f766e"},{key:"incontri",name:"Incontri e scontri",color:"#b45309"}],glossary:[["basileus","Il titolo dell’imperatore bizantino, che era capo dello Stato e dell’esercito e aveva grande autorità anche sulla Chiesa."],["califfo","Il «successore» di Maometto alla guida della comunità dei musulmani."],["egira","La migrazione di Maometto dalla Mecca a Medina nel 622: da quell’anno inizia il calendario islamico."],["iconoclastia","La lotta contro le immagini sacre (icone), che nell’Impero bizantino durò più di un secolo."],["scisma","Una separazione all’interno di una Chiesa. Nel 1054 si separarono la Chiesa di Roma e quella di Costantinopoli."],["mosaico","Immagine composta da tante piccole tessere colorate di pietra o di vetro, tipica dell’arte bizantina."]],capsules:[{key:"fondazione",type:"event",title:"Costantino fonda Costantinopoli",date:"330-05-11",cats:["bizantini"],essential:!0,text:"<p>L’imperatore Costantino inaugura la nuova capitale sul luogo dell’antica <strong>Bisanzio</strong>, in una posizione strategica tra Europa e Asia.</p>",place:{name:"Istanbul (Costantinopoli)",lat:41.0082,lon:28.9784,zoom:11}},{key:"occidente",type:"event",title:"Fine dell’Impero romano d’Occidente",date:"476",cats:["bizantini"],text:"<p>In Occidente l’ultimo imperatore, Romolo Augustolo, viene deposto. In Oriente l’impero continua per quasi mille anni: noi lo chiamiamo <strong>Impero bizantino</strong>.</p>"},{key:"giustiniano",type:"period",title:"Il regno di Giustiniano",date:"527..565",cats:["bizantini"],text:"<p>Giustiniano cerca di ricostruire l’unità dell’impero romano: riconquista l’Italia, il Nord Africa e parte della Spagna, riordina le leggi e fa costruire grandi chiese.</p>"},{key:"corpus",type:"event",title:"Il Corpus iuris civilis",date:"529..534",cats:["bizantini"],text:"<p>Una commissione di giuristi raccoglie e ordina le leggi romane. Il <strong>Corpus iuris civilis</strong> è ancora oggi alla base del diritto di molti Paesi europei.</p>"},{key:"sofia",type:"event",title:"La consacrazione di Santa Sofia",date:"537-12-27",cats:["bizantini"],text:"<p>A Costantinopoli viene consacrata la basilica di <strong>Santa Sofia</strong>, con una cupola enorme per l’epoca. Dopo il 1453 diventerà una moschea.</p>",place:{name:"Santa Sofia, Istanbul",lat:41.0086,lon:28.9802,zoom:16},links:[{label:"La basilica di Santa Sofia su Wikipedia",url:"https://it.wikipedia.org/wiki/Santa_Sofia_(Istanbul)"}]},{key:"maometto",type:"event",title:"La nascita di Maometto",date:"~570",cats:["arabi"],text:"<p>Maometto nasce alla <strong>Mecca</strong>, città di mercanti nella penisola arabica. Verso i quarant’anni inizia a predicare una nuova religione, l’<strong>Islam</strong>.</p>",place:{name:"La Mecca",lat:21.4225,lon:39.8262,zoom:12}},{key:"egira",type:"event",title:"L’Egira",date:"622",cats:["arabi"],essential:!0,text:"<p>Maometto e i suoi seguaci lasciano la Mecca e si trasferiscono a <strong>Medina</strong>. Da questo anno inizia il calendario islamico.</p>",links:[{label:"L’Egira su Wikipedia",url:"https://it.wikipedia.org/wiki/Egira"}]},{key:"morte-maometto",type:"event",title:"La morte di Maometto",date:"632",cats:["arabi"],text:"<p>Alla morte di Maometto quasi tutta la penisola arabica è unita nella nuova fede. La guida della comunità passa ai <strong>califfi</strong>.</p>"},{key:"domanda",type:"question",title:"Due imperi, due capitali",cats:["incontri"],mode:"cloze",clozeMode:"free",blocking:!0,cloze:"<p>La capitale dell’Impero bizantino era [[Costantinopoli]], fondata dall’imperatore [[Costantino]]. La nuova religione predicata da Maometto si chiama [[Islam]] e il suo calendario inizia con l’[[Egira]] del 622.</p>",hint:"<p>Le risposte si trovano nelle capsule che hai già aperto: rileggi i titoli e i testi.</p>",answer:"<p>Costantinopoli, Costantino, Islam, Egira.</p>"},{key:"omayyadi",type:"period",title:"Il califfato omayyade",date:"661..750",cats:["arabi"],text:"<p>I califfi della dinastia omayyade governano da <strong>Damasco</strong> un impero che va dalla penisola iberica fino all’Asia centrale.</p>",place:{name:"Damasco",lat:33.5138,lon:36.2765,zoom:12}},{key:"iberica",type:"event",title:"Gli Arabi nella penisola iberica",date:"711",cats:["arabi","incontri"],text:"<p>Eserciti arabi e berberi attraversano lo stretto di Gibilterra e conquistano gran parte della Spagna, che chiamano <strong>al-Andalus</strong>.</p>"},{key:"assedio",type:"event",title:"Il grande assedio arabo di Costantinopoli",date:"717..718",cats:["incontri"],text:"<p>Gli Arabi assediano la capitale bizantina per terra e per mare, ma vengono respinti anche grazie al <strong>fuoco greco</strong>, una miscela incendiaria che bruciava perfino sull’acqua.</p>"},{key:"iconoclastia",type:"period",title:"L’iconoclastia",date:"~726..843",cats:["bizantini"],text:"<p>Alcuni imperatori vietano le immagini sacre e ne ordinano la distruzione. Nell’843 il culto delle icone viene definitivamente ristabilito.</p>"},{key:"poitiers",type:"event",title:"La battaglia di Poitiers",date:"732",cats:["incontri"],text:"<p>In Francia, i Franchi guidati da <strong>Carlo Martello</strong> fermano un esercito arabo proveniente dalla Spagna.</p>"},{key:"abbasidi",type:"period",title:"Il califfato abbaside",date:"750..1258",cats:["arabi"],showPeriodCapsule:!1,text:"<p>La dinastia abbaside sposta il centro dell’impero verso la Mesopotamia.</p>"},{key:"baghdad",type:"event",title:"La fondazione di Baghdad",date:"762",cats:["arabi"],essential:!0,text:"<p>Il califfo abbaside al-Mansur fonda <strong>Baghdad</strong>, la nuova capitale, che diventa una delle città più grandi e ricche del mondo.</p>",place:{name:"Baghdad",lat:33.3152,lon:44.3661,zoom:11}},{key:"sapienza",type:"event",title:"La Casa della Sapienza",date:"c:9",cats:["arabi","incontri"],text:"<p>A Baghdad studiosi di lingue e religioni diverse traducono in arabo le opere greche, persiane e indiane. Il matematico <strong>al-Khwarizmi</strong> scrive un’opera da cui deriva la parola «algebra»; i numeri che usiamo, nati in India, arriveranno in Europa attraverso gli Arabi.</p>",links:[{label:"La Casa della Sapienza (Bayt al-Ḥikma) su Wikipedia",url:"https://it.wikipedia.org/wiki/Bayt_al-%E1%B8%A4ikma"}]},{key:"scisma",type:"event",title:"Lo scisma d’Oriente",date:"1054",cats:["bizantini"],text:"<p>La Chiesa di Roma e quella di Costantinopoli si separano: nascono la Chiesa cattolica e la Chiesa ortodossa.</p>"},{key:"caduta",type:"event",title:"La caduta di Costantinopoli",date:"1453-05-29",cats:["bizantini","incontri"],essential:!0,text:"<p>I Turchi ottomani, guidati dal sultano Maometto II, conquistano Costantinopoli: finisce l’Impero bizantino, durato più di mille anni dalla fondazione della città.</p>"},{key:"ordina",type:"question",title:"Metti in ordine",cats:["incontri"],mode:"ordering",text:"<p>Metti gli avvenimenti in ordine cronologico, dal più antico al più recente.</p>",order:["La fondazione di Costantinopoli","Il Corpus iuris civilis di Giustiniano","L’Egira di Maometto","La battaglia di Poitiers","La fondazione di Baghdad","Lo scisma d’Oriente","La caduta di Costantinopoli"]},{key:"abbinamenti",type:"question",title:"Personaggi e imprese",cats:["incontri"],mode:"matching",text:"<p>Abbina ogni personaggio alla sua impresa.</p>",pairs:[["Costantino","Fonda la nuova capitale tra Europa e Asia"],["Giustiniano","Fa raccogliere le leggi romane"],["Maometto","Predica l’Islam e compie l’Egira"],["al-Khwarizmi","Scrive un’opera da cui nasce la parola «algebra»"]]},{key:"vf",type:"question",title:"Vero o falso",cats:["incontri"],mode:"truefalse",text:"<p>Indica se le affermazioni sono vere o false.</p>",statements:[["L’Impero bizantino durò fino al 1453.",!0],["La capitale degli Abbasidi era Damasco.",!1],["Il Corpus iuris civilis raccoglie le leggi romane.",!0],["Gli Arabi fecero conoscere in Europa i numeri nati in India.",!0]],answer:"<p>Damasco era la capitale degli Omayyadi; gli Abbasidi governarono da Baghdad.</p>"},{key:"confronto",type:"question",title:"Che cosa avevano in comune?",cats:["incontri"],mode:"quiz",text:"<p>Quali caratteristiche avevano in comune le due civiltà? Seleziona tutte le risposte corrette.</p>",options:[["Avevano capitali grandi e ricche, al centro di importanti commerci",!0],["Conservarono e trasmisero una parte del sapere antico",!0],["Parlavano la stessa lingua",!1],["Praticavano la stessa religione",!1]],answer:"<p>Costantinopoli e Baghdad erano metropoli ricchissime; Bizantini e Arabi conservarono e studiarono le opere antiche, anche se con lingue e religioni diverse.</p>"}],links:[{from:"fondazione",to:"caduta",fromLabel:"Come finisce la storia della città?",toLabel:"Torna alla fondazione",both:!0},{from:"assedio",to:"caduta",fromLabel:"L’ultimo assedio, nel 1453",toLabel:"Un assedio fallito nel 717",both:!0}]},{key:"movimento",label:"Movimento letterario",topic:"Il Dolce Stil Novo",subject:"Italiano",description:"Un movimento letterario con i precedenti, i protagonisti, i temi e l’eredità, più una lettura guidata.",project:{title:"Il Dolce Stil Novo",subtitle:"La poesia d’amore in volgare, da Bologna a Firenze",introLabel:"Come usare questa linea",introduction:"Prima trovi i precedenti del movimento, poi i poeti e le loro opere, infine chi ne ha raccolto l’eredità. Le capsule «Approfondimento» spiegano i temi: leggile quando le incontri. Con i filtri in alto puoi vedere una sola categoria. Le parole sottolineate a puntini hanno una spiegazione nel glossario.",author:"Modello CronoLab",className:"Classe seconda",subject:"Italiano",theme:"archive",accent:"#6d28d9",defaultOrientation:"horizontal",defaultScale:"sequence"},categories:[{key:"precedenti",name:"Prima dello Stil Novo",color:"#b45309"},{key:"poeti",name:"Poeti e opere",color:"#6d28d9"},{key:"temi",name:"Temi e parole chiave",color:"#be185d"},{key:"eredita",name:"Eredità",color:"#0f766e"}],glossary:[["volgare","La lingua parlata dal popolo, nata dal latino. Nel Duecento comincia a essere usata anche per la poesia."],["sonetto","Componimento di quattordici versi endecasillabi, divisi in due quartine e due terzine. Fu inventato alla corte di Federico II."],["canzone","Componimento poetico lungo, formato da più strofe (stanze) costruite tutte allo stesso modo."],["donna-angelo","La donna amata, descritta come una creatura celeste che porta sulla terra la bellezza e la bontà di Dio."],["cor gentile","Il cuore nobile: per gli stilnovisti la nobiltà dipende dalle virtù dell’animo, non dalla famiglia in cui si nasce."],["stilnovisti","I poeti del Dolce Stil Novo, come Guinizzelli, Cavalcanti, Dante e Cino da Pistoia."]],capsules:[{key:"cantico",type:"event",title:"Il Cantico delle creature",date:"~1224..1226",cats:["precedenti"],text:"<p>San <strong>Francesco d’Assisi</strong> loda Dio per le sue creature: il sole, la luna, l’acqua, il fuoco. È uno dei primi testi della letteratura italiana scritti in volgare.</p>",place:{name:"Assisi",lat:43.0707,lon:12.6196,zoom:13}},{key:"siciliana",type:"period",title:"La Scuola siciliana",date:"~1230..1250",cats:["precedenti"],text:"<p>Alla corte dell’imperatore <strong>Federico II</strong> un gruppo di poeti scrive poesie d’amore in volgare siciliano. <strong>Giacomo da Lentini</strong> inventa il <strong>sonetto</strong>.</p>"},{key:"toscani",type:"period",title:"I poeti siculo-toscani",date:"~1250..1290",cats:["precedenti"],text:"<p>Dopo la morte di Federico II la poesia in volgare si sposta nei Comuni della Toscana. Il poeta più noto è <strong>Guittone d’Arezzo</strong>, che usa uno stile difficile e ricercato.</p>"},{key:"stilnovo",type:"period",title:"Il Dolce Stil Novo",date:"~1270..1310",cats:["poeti"],essential:!0,text:"<p>Un piccolo gruppo di poeti, soprattutto a Firenze, propone un modo nuovo di scrivere d’amore: una lingua <strong>dolce</strong> e chiara, lontana dalle complicazioni dei siculo-toscani.</p>"},{key:"guinizzelli",type:"event",title:"Guinizzelli: «Al cor gentil rempaira sempre amore»",date:"~1270",cats:["poeti"],essential:!0,text:"<p>Il bolognese <strong>Guido Guinizzelli</strong> scrive la canzone che diventerà il manifesto del movimento: l’amore può nascere solo in un <strong>cor gentile</strong>, cioè in un cuore nobile per le sue virtù.</p>",place:{name:"Bologna",lat:44.4949,lon:11.3426,zoom:12}},{key:"donna-angelo",type:"note",title:"La donna-angelo",cats:["temi"],text:"<p>La donna non è più una signora da servire, come nella poesia cortese: è una creatura che viene dal cielo. Guardarla e ricevere il suo saluto rende l’uomo migliore e lo avvicina a Dio.</p>"},{key:"cor-gentile",type:"note",title:"Il cor gentile",cats:["temi"],text:"<p>Per gli stilnovisti la vera nobiltà non si eredita dalla famiglia: dipende dall’animo. È un’idea adatta alla società dei Comuni, dove contavano sempre di più mercanti e professionisti.</p>"},{key:"domanda-temi",type:"question",title:"Le idee chiave",cats:["temi"],mode:"quiz",blocking:!0,text:"<p>Quali idee appartengono al Dolce Stil Novo? Seleziona tutte le risposte corrette.</p>",options:[["La donna amata è simile a un angelo",!0],["La nobiltà dipende dall’animo e non dalla nascita",!0],["La poesia deve essere scritta solo in latino",!1],["L’amore è soprattutto un gioco di corte",!1]],hint:"<p>Rileggi le due capsule sui temi: la donna-angelo e il cor gentile.</p>",answer:"<p>Gli stilnovisti scrivono in volgare e vedono nell’amore un’esperienza che eleva l’animo.</p>"},{key:"cavalcanti",type:"event",title:"Guido Cavalcanti",date:"~1258..1300",cats:["poeti"],text:"<p>Poeta e filosofo fiorentino, amico di Dante. Nelle sue poesie l’amore è spesso una forza che turba e fa soffrire. Nel 1300 viene mandato in esilio e muore poco dopo il ritorno a Firenze.</p>"},{key:"vita-nuova",type:"event",title:"Dante scrive la Vita nuova",date:"~1292..1295",cats:["poeti"],text:"<p>In un libro di prosa e poesie, <strong>Dante</strong> racconta il suo amore per <strong>Beatrice</strong>. Il sonetto più famoso inizia così:</p><blockquote><p>Tanto gentile e tanto onesta pare<br>la donna mia quand’ella altrui saluta,<br>ch’ogne lingua deven tremando muta,<br>e li occhi no l’ardiscon di guardare.</p></blockquote>"},{key:"lettura",type:"question",title:"Lettura guidata: «Tanto gentile»",cats:["temi"],mode:"cloze",clozeMode:"select",cloze:"<p>Nel sonetto la donna appare così [[gentile|severa|ricca]] che, quando saluta, le persone non riescono a [[parlare|camminare|cantare]] e non osano [[guardarla|seguirla|toccarla]]. È un esempio del tema della [[donna-angelo|donna crudele|donna guerriera]].</p>",answer:"<p>Il saluto di Beatrice produce meraviglia: chi la vede resta muto e abbassa gli occhi, come davanti a qualcosa di divino.</p>"},{key:"cino",type:"event",title:"Cino da Pistoia",date:"~1270..1336",cats:["poeti"],text:"<p>Giurista e poeta, amico di Dante e più tardi ammirato da Petrarca. Con lui lo stile dolce degli stilnovisti diventa più malinconico e personale.</p>"},{key:"nome",type:"event",title:"Il nome: «dolce stil novo»",date:"~1308..1312",cats:["eredita"],essential:!0,text:"<p>L’espressione compare nel canto XXIV del <strong>Purgatorio</strong>. Il poeta Bonagiunta Orbicciani, incontrando Dante, riconosce che non è riuscito a raggiungere quel «dolce stil novo» che ora sente. Poco più avanti, nel canto XXVI, Dante chiama Guinizzelli suo «padre» in poesia.</p>"},{key:"petrarca",type:"event",title:"Petrarca e il Canzoniere",date:"1336..1374",cats:["eredita"],text:"<p><strong>Francesco Petrarca</strong> lavora per quasi quarant’anni alla raccolta delle sue poesie in volgare per Laura. Riprende molti temi degli stilnovisti, ma Laura è descritta come una donna terrena più che come un angelo, e il poeta analizza soprattutto i propri sentimenti.</p>"},{key:"ordina",type:"question",title:"Metti in ordine",cats:["eredita"],mode:"ordering",text:"<p>Metti in ordine cronologico, dal più antico al più recente.</p>",order:["Il Cantico delle creature di san Francesco","La Scuola siciliana alla corte di Federico II","La canzone di Guinizzelli sul cor gentile","La Vita nuova di Dante","Il Canzoniere di Petrarca"]},{key:"abbina",type:"question",title:"Poeti e città",cats:["poeti"],mode:"matching",text:"<p>Abbina ogni poeta alla città a cui è legato.</p>",pairs:[["Guido Guinizzelli","Bologna"],["Guido Cavalcanti","Firenze"],["Cino","Pistoia"],["Giacomo da Lentini","La corte di Federico II"]]},{key:"aperta",type:"question",title:"Scrivi tu",cats:["temi"],mode:"open",text:"<p>Perché, secondo te, per gli stilnovisti era importante dire che la nobiltà dipende dal cuore e non dalla famiglia? Rispondi in quattro o cinque righe.</p>",answer:"<p>Una risposta possibile: nei Comuni una parte importante della società era formata da mercanti, notai e giudici, che non erano nobili di nascita. L’idea del cor gentile valorizzava le qualità personali, come l’educazione, la sensibilità e la virtù.</p>"}],links:[{from:"guinizzelli",to:"cor-gentile",fromLabel:"Il tema del cor gentile",toLabel:"La canzone di Guinizzelli",both:!0},{from:"vita-nuova",to:"donna-angelo",fromLabel:"Il tema della donna-angelo",toLabel:"Beatrice nella Vita nuova",both:!0},{from:"nome",to:"guinizzelli",fromLabel:"Chi è il «padre» poetico di Dante?",toLabel:"Come lo chiamerà Dante",both:!0}]},{key:"guerra",label:"Guerra o rivoluzione",topic:"La Prima guerra mondiale",subject:"Storia",description:"Cause, fasi, fronti e conseguenze di un conflitto, con attenzione all’Italia e sei tipi di esercizio.",project:{title:"La Prima guerra mondiale",subtitle:"1914–1918: cause, fasi e conseguenze della Grande guerra",introLabel:"Come usare questa linea",introduction:"La linea segue la guerra dall’attentato di Sarajevo alla pace di Versailles. Le categorie distinguono cause, fronti, Italia e conseguenze: usa i filtri in alto oppure apri la Visione sincronica dal menu Vista per confrontarle. Le domande bloccanti vanno risolte per proseguire. Lo schema funziona anche per altre guerre o rivoluzioni: cause, scoppio, fasi, svolta, fine, conseguenze.",author:"Modello CronoLab",className:"Classe terza",subject:"Storia",theme:"essential",accent:"#7c2d12",defaultOrientation:"horizontal",defaultScale:"sequence"},categories:[{key:"cause",name:"Cause e scoppio",color:"#7c2d12"},{key:"fronti",name:"Fronti e battaglie",color:"#475569"},{key:"italia",name:"L’Italia in guerra",color:"#15803d"},{key:"fine",name:"Fine e conseguenze",color:"#1d4ed8"}],glossary:[["alleanze","Accordi tra Stati che si impegnano ad aiutarsi in caso di guerra. Nel 1914 l’Europa era divisa in due blocchi: Triplice intesa e Triplice alleanza."],["guerra di trincea","Guerra di posizione in cui gli eserciti si fronteggiano da lunghe fosse scavate nel terreno, avanzando di pochissimo a prezzo di enormi perdite."],["neutralisti","In Italia, coloro che nel 1914–1915 volevano che il Paese restasse fuori dal conflitto."],["interventisti","In Italia, coloro che volevano l’entrata in guerra, soprattutto per completare l’unità nazionale con Trento e Trieste."],["armistizio","Accordo che sospende i combattimenti. Non è ancora la pace, che viene decisa con un trattato."],["fronte interno","La vita dei civili durante la guerra: lavoro nelle fabbriche, razionamenti, propaganda."]],capsules:[{key:"guerra",type:"period",title:"La Grande guerra",date:"1914-07-28..1918-11-11",cats:["fronti"],showPeriodCapsule:!1,text:"<p>Il conflitto dura più di quattro anni e coinvolge Paesi di tutti i continenti.</p>"},{key:"cause",type:"note",title:"Perché scoppia la guerra?",cats:["cause"],text:"<p>Le cause principali sono:</p><ul><li>la <strong>rivalità</strong> tra le grandi potenze per le colonie e i commerci;</li><li>il <strong>nazionalismo</strong> e la corsa agli armamenti;</li><li>il sistema delle <strong>alleanze</strong>, che trasforma un conflitto locale in una guerra europea;</li><li>le tensioni nei <strong>Balcani</strong>, dove l’Austria-Ungheria e la Serbia si contendono l’influenza.</li></ul>"},{key:"sarajevo",type:"event",title:"L’attentato di Sarajevo",date:"1914-06-28",cats:["cause"],essential:!0,text:"<p>Lo studente serbo-bosniaco <strong>Gavrilo Princip</strong> uccide l’arciduca <strong>Francesco Ferdinando</strong>, erede al trono dell’Austria-Ungheria, e sua moglie Sofia.</p>",place:{name:"Sarajevo",lat:43.8563,lon:18.4131,zoom:13}},{key:"dichiarazione",type:"event",title:"L’Austria-Ungheria dichiara guerra alla Serbia",date:"1914-07-28",cats:["cause"],essential:!0,text:"<p>Un mese dopo l’attentato inizia la guerra. Nel giro di pochi giorni, per il gioco delle alleanze, entrano nel conflitto Russia, Germania, Francia e Regno Unito.</p>"},{key:"marna",type:"event",title:"La battaglia della Marna",date:"1914-09-05..1914-09-12",cats:["fronti"],text:"<p>I Francesi e i Britannici fermano l’avanzata tedesca verso Parigi. Fallisce il piano tedesco di una guerra breve: sul fronte occidentale inizia la <strong>guerra di trincea</strong>.</p>"},{key:"neutralita",type:"period",title:"Neutralisti e interventisti",date:"1914-08-02..1915-05-24",cats:["italia"],text:"<p>All’inizio l’Italia resta <strong>neutrale</strong>, anche se era alleata di Germania e Austria-Ungheria. Nel Paese si scontrano i neutralisti, la maggioranza, e gli interventisti, meno numerosi ma molto attivi nelle piazze e sui giornali.</p>"},{key:"londra",type:"event",title:"Il Patto di Londra",date:"1915-04-26",cats:["italia"],text:"<p>Con un accordo segreto l’Italia si impegna a entrare in guerra a fianco dell’Intesa. In cambio le vengono promessi il Trentino, il Sudtirolo, Trieste, l’Istria e parte della Dalmazia.</p>"},{key:"blocco-1",type:"question",title:"Le cause della guerra",cats:["cause"],mode:"quiz",blocking:!0,text:"<p>Perché un attentato nei Balcani diventò una guerra europea? Seleziona tutte le risposte corrette.</p>",options:[["Perché gli Stati erano legati da alleanze",!0],["Perché tra le potenze c’erano forti rivalità economiche e coloniali",!0],["Perché l’Italia dichiarò subito guerra alla Serbia",!1],["Perché Francesco Ferdinando era l’imperatore di Germania",!1]],hint:"<p>Rileggi la capsula «Perché scoppia la guerra?».</p>",answer:"<p>L’attentato fu la scintilla; le alleanze e le rivalità tra le potenze fecero allargare il conflitto.</p>"},{key:"ingresso",type:"event",title:"L’Italia entra in guerra",date:"1915-05-24",cats:["italia"],essential:!0,text:"<p>L’Italia combatte contro l’Austria-Ungheria su un fronte che va dallo Stelvio al mare Adriatico. Gli scontri più duri avvengono sul fiume <strong>Isonzo</strong> e sul Carso.</p>"},{key:"isonzo",type:"period",title:"Le battaglie dell’Isonzo",date:"1915-06-23..1917-09-12",cats:["italia","fronti"],text:"<p>In poco più di due anni l’esercito italiano, guidato dal generale <strong>Luigi Cadorna</strong>, attacca undici volte sull’Isonzo. Le conquiste sono piccole e le perdite enormi.</p>",place:{name:"Fiume Isonzo, Gorizia",lat:45.9407,lon:13.6207,zoom:10}},{key:"trincea",type:"note",title:"La vita in trincea",cats:["fronti"],text:"<p>I soldati vivono per mesi in fosse fangose, tra freddo, pidocchi, topi e malattie. Gli assalti contro i reticolati e le mitragliatrici causano migliaia di morti in poche ore. Molte lettere e diari di soldati ci raccontano questa esperienza.</p>"},{key:"armi",type:"note",title:"Le nuove armi",cats:["fronti"],text:"<p>È una guerra industriale: mitragliatrici, artiglieria pesante, <strong>gas asfissianti</strong>, carri armati, aerei e sottomarini. Le fabbriche lavorano giorno e notte e molte donne vi prendono il posto degli uomini partiti per il fronte.</p>"},{key:"verdun",type:"event",title:"Verdun e la Somme",date:"1916-02-21..1916-12-18",cats:["fronti"],text:"<p>Sul fronte occidentale due lunghissime battaglie, a <strong>Verdun</strong> e sulla <strong>Somme</strong>, causano complessivamente più di un milione e mezzo tra morti, feriti e dispersi, senza cambiare davvero la situazione.</p>"},{key:"usa",type:"event",title:"Gli Stati Uniti entrano in guerra",date:"1917-04-06",cats:["fronti"],essential:!0,text:"<p>Dopo gli attacchi dei sottomarini tedeschi contro le navi, gli Stati Uniti si schierano con l’Intesa. I loro uomini e le loro risorse saranno decisivi.</p>"},{key:"inutile-strage",type:"event",title:"Benedetto XV: «inutile strage»",date:"1917-08-01",cats:["fine"],text:"<p>Papa <strong>Benedetto XV</strong> invia ai governi in guerra una lettera in cui chiede la pace e definisce il conflitto un’«inutile strage». L’appello resta inascoltato.</p>"},{key:"caporetto",type:"event",title:"La disfatta di Caporetto",date:"1917-10-24",cats:["italia"],essential:!0,text:"<p>Gli Austro-Tedeschi sfondano il fronte italiano. L’esercito si ritira fino al fiume <strong>Piave</strong>, dove riesce a resistere. Cadorna viene sostituito dal generale <strong>Armando Diaz</strong>.</p>",place:{name:"Kobarid (Caporetto)",lat:46.2472,lon:13.5797,zoom:12}},{key:"russia",type:"event",title:"La Russia esce dalla guerra",date:"1918-03-03",cats:["fronti"],text:"<p>Dopo la rivoluzione del 1917, il nuovo governo dei bolscevichi firma con la Germania la pace di <strong>Brest-Litovsk</strong>.</p>"},{key:"vittorio-veneto",type:"event",title:"La battaglia di Vittorio Veneto",date:"1918-10-24..1918-11-04",cats:["italia"],text:"<p>L’offensiva italiana rompe il fronte austro-ungarico, ormai in crisi. Il 3 novembre a <strong>Villa Giusti</strong>, vicino a Padova, viene firmato l’armistizio, che entra in vigore il <strong>4 novembre</strong>.</p>"},{key:"compiegne",type:"event",title:"L’armistizio di Compiègne",date:"1918-11-11",cats:["fine"],essential:!0,text:"<p>La Germania firma l’armistizio in un vagone ferroviario nella foresta di Compiègne, in Francia. La guerra è finita.</p>"},{key:"ordina",type:"question",title:"Metti in ordine",cats:["fronti"],mode:"ordering",text:"<p>Metti gli avvenimenti in ordine cronologico, dal più antico al più recente.</p>",order:["L’attentato di Sarajevo","La battaglia della Marna","L’Italia entra in guerra","Gli Stati Uniti entrano in guerra","La disfatta di Caporetto","L’armistizio di Compiègne"]},{key:"versailles",type:"event",title:"Il trattato di Versailles",date:"1919-06-28",cats:["fine"],essential:!0,text:"<p>Alla Germania, considerata responsabile della guerra, vengono imposte condizioni molto dure: perdita di territori e di colonie, riduzione dell’esercito e pagamento di enormi <strong>riparazioni</strong>. Il risentimento dei Tedeschi peserà sulla storia successiva.</p>"},{key:"conseguenze",type:"note",title:"Le conseguenze",cats:["fine"],text:"<ul><li>Circa <strong>dieci milioni</strong> di soldati morti, tra cui circa 650 000 italiani.</li><li>Scompaiono quattro imperi: tedesco, austro-ungarico, russo e ottomano.</li><li>Nascono nuovi Stati nell’Europa centrale e orientale.</li><li>In Italia si parla di «<strong>vittoria mutilata</strong>» perché non tutti i territori promessi vengono ottenuti.</li></ul>"},{key:"completa",type:"question",title:"La fine della guerra",cats:["fine"],mode:"cloze",clozeMode:"free",cloze:"<p>Dopo la disfatta di Caporetto l’esercito italiano resiste sul fiume [[Piave]]. La guerra per l’Italia finisce il 4 novembre 1918, dopo la battaglia di [[Vittorio Veneto]]. La pace con la Germania viene firmata a [[Versailles]] nel [[1919]].</p>",hint:"<p>Guarda le capsule degli ultimi mesi della guerra.</p>",answer:"<p>Piave, Vittorio Veneto, Versailles, 1919.</p>"},{key:"vf",type:"question",title:"Vero o falso",cats:["italia"],mode:"truefalse",text:"<p>Indica se le affermazioni sono vere o false.</p>",statements:[["Nel 1914 l’Italia entrò subito in guerra a fianco della Germania.",!1],["Con il Patto di Londra all’Italia furono promessi nuovi territori.",!0],["Dopo Caporetto l’esercito italiano si ritirò fino al Piave.",!0],["Il trattato di Versailles fu favorevole alla Germania.",!1]],answer:"<p>L’Italia rimase neutrale fino al maggio 1915 ed entrò in guerra contro l’Austria-Ungheria. Il trattato di Versailles fu molto duro per la Germania.</p>"},{key:"abbina",type:"question",title:"Chi era?",cats:["italia"],mode:"matching",text:"<p>Abbina ogni personaggio al suo ruolo.</p>",pairs:[["Gavrilo Princip","Autore dell’attentato di Sarajevo"],["Luigi Cadorna","Comandante italiano fino a Caporetto"],["Armando Diaz","Comandante italiano dopo Caporetto"],["Benedetto XV","Definì la guerra un’«inutile strage»"]]},{key:"aperta",type:"question",title:"Scrivi tu",cats:["fine"],mode:"open",text:"<p>Molti storici dicono che la Prima guerra mondiale preparò la Seconda. Spiega perché, usando almeno due informazioni della linea del tempo.</p>",answer:"<p>Una risposta possibile: il trattato di Versailles impose alla Germania condizioni durissime, che crearono risentimento e desiderio di rivincita; in Italia il malcontento per la «vittoria mutilata» e la crisi del dopoguerra favorirono movimenti nazionalisti e autoritari.</p>"}],links:[{from:"londra",to:"conseguenze",fromLabel:"Le promesse saranno mantenute?",toLabel:"Che cosa era stato promesso",both:!0},{from:"cause",to:"versailles",fromLabel:"Come finirà?",toLabel:"Torna alle cause",both:!0}]},{key:"scienze",label:"Storia di una scoperta scientifica",topic:"La scoperta della cellula",subject:"Scienze",description:"Come si arriva a una teoria scientifica: strumenti, osservazioni, ipotesi e verifiche, con la scala dei tempi proporzionale.",project:{title:"La scoperta della cellula",subtitle:"Dai primi microscopi alla doppia elica del DNA",introLabel:"Come usare questa linea",introduction:"Questa linea usa la scala dei tempi proporzionale: la distanza tra le capsule corrisponde agli anni trascorsi. Nota i lunghi vuoti: spesso la scienza aspetta uno strumento migliore. Puoi tornare alla sequenza semplice dal menu Vista.",author:"Modello CronoLab",className:"Classe prima",subject:"Scienze",theme:"notebook",accent:"#15803d",defaultOrientation:"horizontal",defaultScale:"proportional"},categories:[{key:"strumenti",name:"Strumenti",color:"#0369a1"},{key:"osservazioni",name:"Osservazioni",color:"#15803d"},{key:"teorie",name:"Teorie e leggi",color:"#a16207"}],glossary:[["cellula","L’unità più piccola di un essere vivente capace di svolgere tutte le funzioni della vita: nutrirsi, crescere, riprodursi."],["microscopio","Strumento che, grazie a una o più lenti, permette di vedere ingranditi oggetti troppo piccoli per l’occhio umano."],["nucleo","La parte della cellula che contiene il materiale genetico (DNA) e controlla le sue attività."],["mitosi","Il processo con cui una cellula si divide in due cellule figlie con lo stesso materiale genetico."],["teoria cellulare","La teoria secondo cui tutti gli esseri viventi sono formati da cellule e ogni cellula deriva da un’altra cellula."],["generazione spontanea","L’antica idea, poi smentita, che alcuni esseri viventi potessero nascere dalla materia non vivente."]],capsules:[{key:"faber",type:"event",title:"Nasce la parola «microscopio»",date:"1625",cats:["strumenti"],text:"<p>A Roma, nell’Accademia dei Lincei, lo studioso <strong>Giovanni Faber</strong> propone il nome «microscopio» per lo strumento a lenti che permette di vedere le cose piccolissime. Tra i primi a usarlo c’è anche Galileo Galilei.</p>"},{key:"malpighi",type:"event",title:"Malpighi scopre i capillari",date:"1661",cats:["osservazioni"],text:"<p>Osservando al microscopio i polmoni di una rana, il medico bolognese <strong>Marcello Malpighi</strong> vede i capillari, i piccolissimi vasi che collegano arterie e vene.</p>",place:{name:"Bologna",lat:44.4949,lon:11.3426,zoom:12}},{key:"hooke",type:"event",title:"Hooke osserva le «celle» del sughero",date:"1665",cats:["osservazioni"],essential:!0,text:"<p>Nel libro <strong>Micrographia</strong> l’inglese <strong>Robert Hooke</strong> descrive una sottile fetta di sughero: è formata da tante piccole cavità, che chiama <em>cells</em>, «celle», come quelle di un alveare. In realtà vede solo le pareti di cellule morte.</p>",links:[{label:"La Micrographia di Hooke su Wikipedia",url:"https://it.wikipedia.org/wiki/Micrografia_(trattato)"}]},{key:"leeuwenhoek",type:"event",title:"Leeuwenhoek vede i microrganismi",date:"1674",cats:["strumenti","osservazioni"],text:"<p>L’olandese <strong>Antoni van Leeuwenhoek</strong> costruisce da solo microscopi con una lente molto potente. In una goccia d’acqua di lago scopre minuscoli esseri viventi, che chiama «animaletti». Pochi anni dopo osserva anche i batteri.</p>"},{key:"pausa",type:"note",title:"Perché una pausa così lunga?",cats:["strumenti"],text:"<p>Guarda lo spazio vuoto sulla linea: per più di un secolo e mezzo le scoperte sulla cellula procedono lentamente. Le lenti dell’epoca producono immagini sfocate e colorate ai bordi. Solo nell’Ottocento microscopi migliori permettono di vedere l’interno delle cellule.</p>"},{key:"brown",type:"event",title:"Brown descrive il nucleo",date:"1831",cats:["osservazioni"],text:"<p>Il botanico scozzese <strong>Robert Brown</strong> nota che in tutte le cellule delle orchidee che osserva c’è una piccola struttura scura: la chiama <strong>nucleo</strong>.</p>"},{key:"schleiden",type:"event",title:"Schleiden: le piante sono fatte di cellule",date:"1838",cats:["teorie"],text:"<p>Il botanico tedesco <strong>Matthias Schleiden</strong> afferma che tutte le parti delle piante sono formate da cellule.</p>"},{key:"schwann",type:"event",title:"Schwann: anche gli animali",date:"1839",cats:["teorie"],essential:!0,text:"<p>Il fisiologo <strong>Theodor Schwann</strong> estende l’idea agli animali. Nasce la <strong>teoria cellulare</strong>: tutti gli esseri viventi sono formati da cellule, e la cellula è l’unità fondamentale della vita.</p>",links:[{label:"La teoria cellulare su Wikipedia",url:"https://it.wikipedia.org/wiki/Teoria_cellulare"}]},{key:"blocco",type:"question",title:"Chi ha osservato che cosa?",cats:["osservazioni"],mode:"matching",blocking:!0,text:"<p>Abbina ogni scienziato alla sua osservazione. Per proseguire devi completare l’esercizio.</p>",pairs:[["Robert Hooke","Le «celle» del sughero"],["Antoni van Leeuwenhoek","Microrganismi in una goccia d’acqua"],["Robert Brown","Il nucleo nelle cellule delle piante"],["Marcello Malpighi","I capillari nei polmoni di rana"]],hint:"<p>Rileggi le capsule della categoria «Osservazioni»: ognuna racconta una scoperta fatta guardando al microscopio.</p>"},{key:"virchow",type:"event",title:"Virchow: ogni cellula da una cellula",date:"1855",cats:["teorie"],essential:!0,text:"<p>Il medico tedesco <strong>Rudolf Virchow</strong> diffonde il principio <em>omnis cellula e cellula</em>: ogni cellula nasce da un’altra cellula. È il terzo punto della teoria cellulare, sostenuto anche dalle ricerche di Robert Remak.</p>"},{key:"pasteur",type:"event",title:"Pasteur e la generazione spontanea",date:"~1859..1862",cats:["teorie"],text:"<p>Con i suoi famosi palloni dal collo a «S», il francese <strong>Louis Pasteur</strong> dimostra che in un brodo sterile e protetto non nascono microrganismi: la vita non si genera spontaneamente dalla materia non vivente.</p>"},{key:"flemming",type:"event",title:"Flemming descrive la mitosi",date:"1882",cats:["osservazioni"],text:"<p>Colorando le cellule, il tedesco <strong>Walther Flemming</strong> osserva come si muovono i cromosomi durante la divisione cellulare e chiama questo processo <strong>mitosi</strong>.</p>"},{key:"golgi",type:"event",title:"Golgi e l’apparato reticolare",date:"1898",cats:["osservazioni"],text:"<p>Il medico italiano <strong>Camillo Golgi</strong>, grazie a un metodo di colorazione da lui inventato, scopre una struttura interna alla cellula che oggi porta il suo nome: l’<strong>apparato di Golgi</strong>. Nel 1906 riceverà il premio Nobel.</p>",place:{name:"Pavia",lat:45.1847,lon:9.1582,zoom:13}},{key:"cellula-oggi",type:"note",title:"Cellula animale e cellula vegetale",cats:["osservazioni"],text:"<p>Oggi sappiamo che le cellule vegetali hanno strutture che mancano in quelle animali: la <strong>parete cellulare</strong>, i <strong>cloroplasti</strong> per la fotosintesi e un grande <strong>vacuolo</strong>.</p>",image:{src:"cellula",alt:"Schema di una cellula animale tonda e di una cellula vegetale rettangolare con nucleo, mitocondri, parete, cloroplasti e vacuolo",caption:"Le principali strutture della cellula animale e di quella vegetale",source:"Illustrazione del modello CronoLab"}},{key:"elettronico",type:"event",title:"Il microscopio elettronico",date:"1931",cats:["strumenti"],text:"<p>In Germania <strong>Ernst Ruska</strong> e <strong>Max Knoll</strong> costruiscono il primo microscopio elettronico. Usando un fascio di elettroni al posto della luce, nei decenni successivi permetterà di ottenere ingrandimenti migliaia di volte superiori a quelli dei microscopi ottici.</p>"},{key:"dna",type:"event",title:"La doppia elica del DNA",date:"1953-04-25",cats:["teorie"],essential:!0,text:"<p><strong>James Watson</strong> e <strong>Francis Crick</strong> pubblicano il modello a doppia elica del DNA, la molecola contenuta nel nucleo che trasmette le informazioni ereditarie. Decisive sono state le immagini ai raggi X ottenute da <strong>Rosalind Franklin</strong>.</p>"},{key:"ordina",type:"question",title:"Strumenti e scoperte in ordine",cats:["strumenti"],mode:"ordering",text:"<p>Metti in ordine cronologico, dal più antico al più recente.</p>",order:["Hooke osserva il sughero","Brown descrive il nucleo","Schwann estende la teoria cellulare agli animali","Flemming descrive la mitosi","Il primo microscopio elettronico","Il modello a doppia elica del DNA"]},{key:"teoria",type:"question",title:"I tre punti della teoria cellulare",cats:["teorie"],mode:"cloze",clozeMode:"select",cloze:"<p>1. Tutti gli esseri viventi sono formati da una o più [[cellule|capillari|lenti]].<br>2. La cellula è l’unità fondamentale della [[vita|materia|luce]].<br>3. Ogni cellula deriva da un’altra [[cellula|goccia d’acqua|sostanza non vivente]].</p>",answer:"<p>I primi due punti vengono da Schleiden e Schwann; il terzo è il principio diffuso da Virchow.</p>"},{key:"vf",type:"question",title:"Vero o falso",cats:["teorie"],mode:"truefalse",text:"<p>Indica se le affermazioni sono vere o false.</p>",statements:[["Hooke vide cellule vive con il nucleo e i cloroplasti.",!1],["La teoria cellulare vale sia per le piante sia per gli animali.",!0],["Pasteur dimostrò che la vita nasce spontaneamente nei brodi.",!1],["Le cellule vegetali hanno la parete cellulare.",!0]],answer:"<p>Hooke vide solo le pareti di cellule morte del sughero; Pasteur dimostrò il contrario della generazione spontanea.</p>"},{key:"scelta",type:"question",title:"Il ruolo degli strumenti",cats:["strumenti"],mode:"quiz",text:"<p>Quali affermazioni spiegano il legame tra strumenti e scoperte? Seleziona tutte le risposte corrette.</p>",options:[["Senza lenti adeguate non era possibile vedere l’interno delle cellule",!0],["Le tecniche di colorazione aiutarono a distinguere le strutture della cellula",!0],["Il microscopio elettronico fu usato già da Hooke",!1],["La teoria cellulare nacque senza bisogno di osservazioni",!1]],answer:"<p>Microscopi migliori e nuove tecniche di colorazione hanno reso possibili quasi tutte le scoperte di questa linea.</p>"},{key:"aperta",type:"question",title:"Da scienziato",cats:["teorie"],mode:"open",text:"<p>Scegli una scoperta della linea e spiega quale domanda si poneva lo scienziato, che cosa ha osservato e che cosa ha concluso.</p>",answer:"<p>Esempio: Pasteur si chiedeva se i microrganismi potessero nascere dal nulla. Osservò che nei palloni a collo di cigno il brodo restava limpido finché la polvere non poteva entrare. Concluse che i microrganismi provengono sempre da altri microrganismi.</p>"}],links:[{from:"hooke",to:"cellula-oggi",fromLabel:"Che cosa sappiamo oggi",toLabel:"Le prime «celle» di Hooke",both:!0},{from:"brown",to:"dna",fromLabel:"Che cosa c’è nel nucleo?",toLabel:"Dove si trova il DNA",both:!0}]},{key:"procedura",label:"Procedura passo per passo",topic:"Risolvere un’equazione di primo grado",subject:"Matematica",description:"Una procedura divisa in passi numerati invece che in date, con un esempio svolto dall’inizio alla fine.",project:{title:"Risolvere un’equazione di primo grado",subtitle:"Sette passi, un esempio svolto e gli esercizi per allenarsi",introLabel:"Come usare questa linea",introduction:"Qui la linea non misura il tempo della storia, ma l’ordine dei passi. Seguiamo sempre lo stesso esempio: 2(x − 1) + (x + 1)/2 = x + 3. Gli eventi sono i passi, gli approfondimenti spiegano le regole e i casi particolari; con i filtri in alto puoi vedere solo i passi. Lo stesso schema va bene per qualsiasi procedura: un esperimento, un’analisi grammaticale, un problema di geometria.",author:"Modello CronoLab",className:"Classe terza",subject:"Matematica",theme:"notebook",accent:"#1d4ed8",defaultOrientation:"horizontal",defaultScale:"sequence"},categories:[{key:"passi",name:"Passi della procedura",color:"#1d4ed8"},{key:"regole",name:"Regole",color:"#7c3aed"},{key:"attenzione",name:"Casi particolari",color:"#be123c"}],glossary:[["equazione","Un’uguaglianza tra due espressioni che contiene almeno una lettera, detta incognita. Risolverla significa trovare i valori che la rendono vera."],["incognita","La lettera (di solito x) che rappresenta il numero da trovare."],["membro","Ciascuna delle due parti dell’equazione: il primo membro sta a sinistra dell’uguale, il secondo a destra."],["soluzione","Il valore dell’incognita che rende vera l’uguaglianza."],["coefficiente","Il numero che moltiplica l’incognita. In 3x il coefficiente è 3."],["equazioni equivalenti","Equazioni che hanno le stesse soluzioni."],["mcm","Minimo comune multiplo: il più piccolo numero che è multiplo di tutti i denominatori."]],capsules:[{key:"fase-prepara",type:"period",title:"Preparare l’equazione",date:"1..3",dateLabel:"Passi 1–3",cats:["passi"],text:"<p>Nei primi passi si «ripulisce» l’equazione: si leggono bene i due membri, si eliminano le parentesi e i denominatori.</p>"},{key:"passo-1",type:"event",title:"Leggi e riconosci",date:"1",dateLabel:"Passo 1",cats:["passi"],essential:!0,text:"<p>Individua l’<strong>incognita</strong>, il <strong>primo membro</strong> e il <strong>secondo membro</strong>. Controlla che la x compaia solo con esponente 1: è un’equazione di primo grado.</p><p><strong>Esempio:</strong> 2(x − 1) + (x + 1)/2 = x + 3</p>"},{key:"principi",type:"note",title:"La bilancia e i due principi",cats:["regole"],essential:!0,text:"<p>Un’equazione è come una bilancia in equilibrio. Per non romperlo:</p><ul><li><strong>Primo principio:</strong> puoi aggiungere o togliere lo stesso numero (o la stessa espressione) a entrambi i membri.</li><li><strong>Secondo principio:</strong> puoi moltiplicare o dividere entrambi i membri per lo stesso numero, purché diverso da zero.</li></ul><p>Così ottieni sempre un’equazione <strong>equivalente</strong>, cioè con la stessa soluzione.</p>",image:{src:"bilancia",alt:"Una bilancia a due piatti in equilibrio: sul piatto sinistro 3x − 2, sul destro x + 6",caption:"Ciò che fai su un piatto, fallo anche sull’altro",source:"Illustrazione del modello CronoLab"}},{key:"passo-2",type:"event",title:"Elimina le parentesi",date:"2",dateLabel:"Passo 2",cats:["passi"],text:"<p>Applica la <strong>proprietà distributiva</strong>: moltiplica il numero davanti alla parentesi per ogni termine all’interno. Attenzione ai segni.</p><p>2(x − 1) diventa 2x − 2, quindi:</p><p><strong>2x − 2 + (x + 1)/2 = x + 3</strong></p>"},{key:"passo-3",type:"event",title:"Elimina i denominatori",date:"3",dateLabel:"Passo 3",cats:["passi"],text:"<p>Calcola il <strong>mcm</strong> dei denominatori (qui è 2) e moltiplica <strong>ogni termine</strong> di entrambi i membri per quel numero. È il secondo principio.</p><p><strong>4x − 4 + x + 1 = 2x + 6</strong></p>"},{key:"fase-risolvi",type:"period",title:"Isolare l’incognita",date:"4..6",dateLabel:"Passi 4–6",cats:["passi"],text:"<p>Poi si portano tutte le incognite da una parte e tutti i numeri dall’altra, fino a trovare il valore di x.</p>"},{key:"passo-4",type:"event",title:"Trasporta i termini",date:"4",dateLabel:"Passo 4",cats:["passi"],essential:!0,text:"<p>Porta i termini con la x al primo membro e i numeri al secondo. Un termine che <strong>cambia membro cambia segno</strong>: è una conseguenza del primo principio.</p><p><strong>4x + x − 2x = 6 + 4 − 1</strong></p>"},{key:"blocco",type:"question",title:"Controlla il trasporto",cats:["regole"],mode:"quiz",blocking:!0,text:"<p>Nell’equazione 3x − 5 = 10 porti −5 al secondo membro. Che cosa scrivi?</p>",options:[["3x = 10 + 5",!0],["3x = 10 − 5",!1],["3x = 10 · 5",!1],["3x − 5 − 10 = 0 e ti fermi",!1]],hint:"<p>Quando un termine passa dall’altra parte dell’uguale cambia segno.</p>",answer:"<p>Il termine −5 cambia membro e quindi cambia segno: diventa +5. Si ottiene 3x = 15 e quindi x = 5.</p>"},{key:"passo-5",type:"event",title:"Riduci i termini simili",date:"5",dateLabel:"Passo 5",cats:["passi"],text:"<p>Somma tra loro i termini con la x e tra loro i numeri.</p><p>4x + x − 2x = 3x e 6 + 4 − 1 = 9, quindi:</p><p><strong>3x = 9</strong></p>"},{key:"passo-6",type:"event",title:"Dividi per il coefficiente",date:"6",dateLabel:"Passo 6",cats:["passi"],essential:!0,text:"<p>Dividi entrambi i membri per il <strong>coefficiente</strong> della x (secondo principio).</p><p>3x : 3 = 9 : 3, quindi:</p><p><strong>x = 3</strong></p>"},{key:"casi",type:"note",title:"Impossibile o indeterminata?",cats:["attenzione"],text:"<p>A volte, dopo la riduzione, il coefficiente della x è zero:</p><ul><li><strong>0x = 5</strong> → nessun numero moltiplicato per 0 dà 5: l’equazione è <strong>impossibile</strong>.</li><li><strong>0x = 0</strong> → qualsiasi numero va bene: l’equazione è <strong>indeterminata</strong>.</li></ul><p>In questi casi non si può dividere per il coefficiente, perché non si divide per zero.</p>"},{key:"passo-7",type:"event",title:"Verifica la soluzione",date:"7",dateLabel:"Passo 7",cats:["passi"],essential:!0,text:"<p>Sostituisci il valore trovato nell’equazione <strong>di partenza</strong> e calcola i due membri separatamente. Se sono uguali, la soluzione è corretta.</p><p>Primo membro: 2(3 − 1) + (3 + 1)/2 = 4 + 2 = <strong>6</strong><br>Secondo membro: 3 + 3 = <strong>6</strong></p><p>6 = 6: la soluzione x = 3 è corretta.</p>"},{key:"errori",type:"note",title:"Gli errori più frequenti",cats:["attenzione"],text:"<ul><li>Dimenticare di cambiare segno nel trasporto.</li><li>Moltiplicare per il mcm solo i termini con il denominatore e non tutti gli altri.</li><li>Nella parentesi preceduta dal segno meno, cambiare il segno solo del primo termine.</li><li>Dimenticare il segno del coefficiente: da −2x = 8 si ottiene x = −4, non x = 4.</li></ul>"},{key:"ordina",type:"question",title:"L’ordine dei passi",cats:["passi"],mode:"ordering",text:"<p>Metti i passi della procedura nell’ordine giusto.</p>",order:["Leggere l’equazione e riconoscere i due membri","Eliminare le parentesi","Eliminare i denominatori","Trasportare i termini","Ridurre i termini simili","Dividere per il coefficiente dell’incognita","Verificare la soluzione"]},{key:"completa",type:"question",title:"Risolvi tu: 5x + 4 = 2x + 19",cats:["passi"],mode:"cloze",clozeMode:"select",cloze:"<p>Trasporto: 5x − [[2x|19|4]] = 19 − [[4|2x|5x]]<br>Riduco: [[3x|7x|x]] = [[15|23|19]]<br>Divido per il coefficiente: x = [[5|3|15]]</p>",answer:"<p>5x − 2x = 19 − 4, quindi 3x = 15 e x = 5. Verifica: 5 · 5 + 4 = 29 e 2 · 5 + 19 = 29.</p>"},{key:"vf",type:"question",title:"Vero o falso",cats:["regole"],mode:"truefalse",text:"<p>Indica se le affermazioni sono vere o false.</p>",statements:[["Se aggiungo lo stesso numero a entrambi i membri ottengo un’equazione equivalente.",!0],["Quando trasporto un termine nell’altro membro lascio lo stesso segno.",!1],["L’equazione 0x = 7 è impossibile.",!0],["x = 2 è la soluzione di 3x − 1 = 7.",!1]],answer:"<p>Nel trasporto il segno cambia. Per x = 2 il primo membro vale 3 · 2 − 1 = 5, non 7: la soluzione di 3x − 1 = 7 è x = 8/3.</p>"},{key:"abbina",type:"question",title:"Equazioni e soluzioni",cats:["regole"],mode:"matching",text:"<p>Abbina ogni equazione alla sua soluzione.</p>",pairs:[["x + 7 = 10","x = 3"],["4x = 20","x = 5"],["2x − 6 = 2","x = 4"],["x/3 = 2","x = 6"],["0x = 5","Impossibile"]]},{key:"aperta",type:"question",title:"Dal problema all’equazione",cats:["regole"],mode:"open",text:"<p>Inventa un breve problema che si possa risolvere con l’equazione 2x + 3 = 11. Poi risolvilo e verifica la soluzione.</p>",answer:"<p>Esempio: «Il doppio di un numero, aumentato di 3, è 11. Qual è il numero?» 2x = 11 − 3, 2x = 8, x = 4. Verifica: 2 · 4 + 3 = 11.</p>"}],links:[{from:"passo-4",to:"principi",fromLabel:"Perché il segno cambia?",toLabel:"Il primo principio in azione",both:!0},{from:"passo-6",to:"casi",fromLabel:"E se il coefficiente è zero?",toLabel:"Il caso normale",both:!0}]}],qg={commedia:"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Georgia,'Times New Roman',serif">
