.tutorial-faq[open] summary{color:var(--brand-ink);border-bottom:1px solid var(--line);background:#fbfbff}

.tutorial-answer ul,.tutorial-answer ol{margin:8px 0 13px;padding-left:21px}
.tutorial-answer li+li{margin-top:5px}
.tutorial-answer strong{color:#303646}
.tutorial-answer a,.tutorial-changelog a{color:var(--brand-ink);font-weight:780}
.tutorial-tip{padding:10px 12px;border-radius:9px;background:#f1f6ff;color:#42516a}

.tutorial-changelog{max-width:850px;margin:0 auto;padding:34px clamp(22px,5vw,54px) 64px}
.tutorial-back{display:inline-flex;margin-bottom:23px;text-decoration:none}

.tutorial-release-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.tutorial-release h3{margin:0;font-size:1.15rem}
.tutorial-release-badge{padding:4px 9px;border-radius:999px;background:#f4e1e5;color:var(--brand-ink);font-size:.65rem;font-weight:850;text-transform:uppercase;letter-spacing:.07em}
.tutorial-release h4{margin:18px 0 7px;font-size:.84rem}
.tutorial-release ul{margin:0;padding-left:20px;color:#555d6e;font-size:.81rem;line-height:1.62}
.tutorial-release li+li{margin-top:5px}
@media(max-width:820px){
  .tutorial-shell,.tutorial-layout{min-height:0}
  .tutorial-layout{display:block;background:#f7f8fc}
  .tutorial-menu{top:0;height:auto;min-height:0;max-height:none;padding:10px 13px;border-right:0;border-bottom:1px solid var(--line);box-shadow:0 7px 18px #2c324512}
  .tutorial-menu-title{display:none}
  .tutorial-menu nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
  .tutorial-menu a{flex:none;padding:8px 9px;font-size:.71rem}
  .tutorial-content{padding:18px 14px 48px}
  .tutorial-intro{padding:21px 18px;border-radius:16px}
  .tutorial-section{margin-top:32px}
  .tutorial-faq summary{padding-left:14px;font-size:.81rem}
  .tutorial-answer{padding:14px;font-size:.79rem}
  .tutorial-changelog{padding:24px 16px 48px}
  .tutorial-release{padding:19px}
}

<body>
<!--
  CONTENUTO DEL TUTORIAL
  Puoi modificare testi, titoli, grassetti e collegamenti direttamente nei tag HTML qui sotto.
  Non cambiare gli attributi id, href e data-tutorial-page: servono alla navigazione.
-->
<template id="cronolab-tutorial-content">
  <div class="tutorial-layout">
    <aside class="tutorial-menu" aria-label="Sezioni del Tutorial">
      <p class="tutorial-menu-title">In questa pagina</p>
      <nav>
        <a href="#tutorial-primi-passi">Primi passi</a>
        <a href="#tutorial-capsule">Capsule e date</a>
        <a href="#tutorial-contenuti">Contenuti</a>
        <a href="#tutorial-attivita">Attività</a>
        <a href="#tutorial-visualizzatore">Visualizzatore</a>
        <a href="#tutorial-esportazione">Esportazione</a>
        <a href="#tutorial-didattica">Uso didattico</a>
      </nav>
    </aside>

    <article class="tutorial-content">
      <header class="tutorial-intro" id="tutorial-inizio">
        <p class="tutorial-kicker">Tutorial</p>
        <h2>Creare e usare una linea del tempo con CronoLab</h2>
        <p>
          CronoLab è uno strumento per progettare <strong>linee del tempo didattiche interattive</strong>,
          arricchite con testi, immagini, fonti, luoghi ed esercizi
          (<a class="tutorial-version-link" href="#" data-tutorial-page="changes">versione 0.6</a>).
        </p>
        <p class="tutorial-beta">
          <strong>CronoLab è ancora in versione beta.</strong> Potrebbero quindi esserci errori e alcune funzioni
          potrebbero cambiare, essere spostate o venire migliorate da un momento all’altro.
        </p>
      </header>

      <section class="tutorial-section" id="tutorial-primi-passi">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">01</span>
          <h3>Primi passi</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Da dove conviene iniziare?</summary>
            <div class="tutorial-answer">
              <p>
                Puoi partire da un progetto vuoto, scegliere uno dei <strong>Modelli pronti</strong> dal menu
                <strong>Strumenti</strong> oppure riaprire un progetto CronoLab in formato <strong>HTML o JSON</strong>. In
                <strong>Impostazioni</strong> inserisci titolo, sottotitolo, introduzione, autore, classe e materia,
                quindi scegli tema, colore principale e orientamento iniziale.
              </p>
              <p class="tutorial-tip">
                Per prendere confidenza con CronoLab, prova prima a creare tre capsule: un evento,
                un approfondimento e una domanda.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si sceglie l’aspetto della linea?</summary>
            <div class="tutorial-answer">
              <p>
                In <strong>Impostazioni</strong> puoi scegliere i temi Essenziale, Quaderno o Archivio,
                il colore principale e la vista iniziale orizzontale o verticale. Anche l’<strong>editor</strong> può essere
                usato in modalità chiara o scura tramite il pulsante dedicato nella barra superiore. Nel visualizzatore
                chi consulta la linea può passare dal tema chiaro a quello scuro e cambiare orientamento; sugli schermi
                piccoli CronoLab privilegia automaticamente la vista verticale.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Il lavoro viene salvato automaticamente?</summary>
            <div class="tutorial-answer">
              <p>
                No. Il progetto rimane nel browser soltanto mentre lavori. Usa regolarmente la funzione <strong>Esporta</strong>:
                <strong>Esporta HTML interattivo</strong> crea la linea pronta da condividere e riapribile nell’editor,
                mentre <strong>Esporta JSON</strong> crea una copia strutturata completa del progetto, utile anche come backup.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come funzionano Annulla e Ripristina?</summary>
            <div class="tutorial-answer">
              <p>
                CronoLab conserva le ultime <strong>30 azioni</strong> del progetto aperto. Puoi usare i pulsanti
                nella barra superiore oppure le scorciatoie <strong>Ctrl/Cmd+Z</strong>,
                <strong>Ctrl/Cmd+Maiusc+Z</strong> e <strong>Ctrl/Cmd+Y</strong>. Quando apri un altro progetto,
                la cronologia riparte da zero.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>A cosa servono gli strumenti di controllo?</summary>
            <div class="tutorial-answer">
              <p>
                Nel menu <strong>Strumenti</strong> trovi Glossario, Controllo completezza,
                Unisci linee del tempo, Importa da MapLab e Modelli pronti.
                Il <strong>Controllo completezza</strong> segnala campi mancanti o contenuti da rivedere:
                non sostituisce la revisione didattica, ma aiuta a individuare dimenticanze.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Che cosa sono i Modelli pronti?</summary>
            <div class="tutorial-answer">
              <p>
                Sono sette linee del tempo complete, da usare così come sono o da adattare cambiando i contenuti:
                <strong>biografia di un autore</strong> (Dante), <strong>periodo storico</strong> (le scoperte geografiche),
                <strong>confronto tra due civiltà</strong> (Bizantini e Arabi), <strong>movimento letterario</strong>
                (il Dolce Stil Novo), <strong>guerra o rivoluzione</strong> (la Prima guerra mondiale),
                <strong>storia di una scoperta scientifica</strong> (la cellula) e <strong>procedura passo per passo</strong>
                (le equazioni di primo grado).
              </p>
              <p>
                Ogni modello contiene categorie, luoghi, glossario, rimandi ed esercizi di tipo diverso. Aprire un modello
                sostituisce la linea corrente: esporta prima il lavoro che vuoi conservare.
              </p>
              <p class="tutorial-tip">
                Nel modello sulle equazioni i «passi» usano la data come numero d’ordine con un’etichetta
                personalizzata: è un modo per costruire linee che descrivono procedure invece di epoche.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si uniscono più linee del tempo?</summary>
            <div class="tutorial-answer">
              <p>
                Seleziona <strong>Strumenti → Unisci linee del tempo</strong> e scegli i file HTML da aggiungere.
                Puoi includere anche la linea aperta oppure esportarla prima di continuare. CronoLab crea sempre
                un <strong>nuovo progetto</strong>: nella selezione generale indichi quali tipi di capsule importare,
                mentre le <strong>Opzioni avanzate</strong> permettono di personalizzare la scelta per ogni file.
              </p>
              <p>
                Le categorie possono essere mantenute, sostituite da una categoria assegnata a ogni linea,
                mantenute insieme alla categoria della linea di provenienza oppure rimosse. Se categorie omonime
                hanno colori diversi o una parola del Glossario possiede più
                definizioni, CronoLab chiede quale versione conservare. Le domande bloccanti sono disattivate per
                impostazione predefinita, ma possono essere mantenute con l’apposito interruttore.
              </p>
              <p>
                Prima della creazione compare un riepilogo. I possibili duplicati vengono soltanto segnalati;
                i rimandi interni restano validi se entrambe le capsule collegate sono state importate. Dopo la
                conferma si aprono le <strong>Impostazioni</strong> della nuova linea. Questa funzione è utile anche
                per riunire lavori prodotti da gruppi diversi, purché titoli, categorie e fonti siano stati
                concordati in precedenza.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-capsule">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">02</span>
          <h3>Capsule e date</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Che cos’è una capsula e quali tipi esistono?</summary>
            <div class="tutorial-answer">
              <p>
                Una capsula è l’unità di contenuto della linea. <strong>Evento</strong> descrive un fatto;
                <strong>Periodo</strong> rappresenta una durata; <strong>Approfondimento</strong> aggiunge un
                commento, un documento o un contesto; <strong>Domanda</strong> propone un’attività.
                Le capsule possono essere duplicate, eliminate e riordinate.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Quali date posso inserire?</summary>
            <div class="tutorial-answer">
              <p>
                Puoi usare giorno, mese e anno; solo anno; intervallo; secolo; oppure nessuna data.
                Sono disponibili date a.C., indicazione approssimativa ed etichetta personalizzata.
                L’etichetta <strong>cambia solo ciò che si legge</strong>, ma non il punto usato per l’ordinamento.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come vengono mostrati i periodi?</summary>
            <div class="tutorial-answer">
              <p>
                Un periodo richiede una data iniziale e una finale. Nel visualizzatore appare come una
                fascia parallela alla linea; periodi sovrapposti occupano corsie diverse.
                Puoi decidere se mostrare anche la relativa capsula. Se la capsula è nascosta, la fascia resta
                un riferimento visivo ma non è selezionabile.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Quando usare una capsula senza data?</summary>
            <div class="tutorial-answer">
              <p>
                È utile per consegne, fonti generali, commenti o domande che non appartengono a un momento preciso.
                Nell’ordinamento automatico resta vicina all’ultimo elemento datato che la precede.
                Le capsule senza data non compaiono nella <strong>Visione sincronica</strong>.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si decide l’ordine delle capsule?</summary>
            <div class="tutorial-answer">
              <p>
                <strong>Ordina per data</strong> costruisce la sequenza cronologica. Con
                <strong>Ordina manualmente</strong> puoi invece progettare un percorso personale trascinando
                le capsule o usando le frecce; durante questa modalità i contenuti non sono modificabili.
                Premi <strong>Fatto</strong> per tornare all’editor.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come funzionano categorie e colori?</summary>
            <div class="tutorial-answer">
              <p>
                Ogni capsula può appartenere a <strong>più categorie</strong>. Nel visualizzatore le categorie usate
                diventano filtri combinabili: quando ne selezioni una o più, restano visibili le capsule che appartengono
                ad almeno una delle categorie selezionate, mentre quelle senza categoria vengono nascoste. Una capsula nuova è inizialmente senza categoria. Il colore della capsula segue questa priorità:
                <strong>colore personalizzato, poi colore del tipo</strong>. Il colore della categoria non sostituisce
                quello della capsula.
              </p>
              <p>
                Nelle <strong>Impostazioni</strong> puoi scegliere quali categorie mostrare nella
                <strong>Visione sincronica</strong>. Le nuove categorie sono escluse per impostazione predefinita;
                le capsule senza categoria non possono essere incluse in questa vista.
              </p>
              <p>
                Il selettore consente di usare spettro, tonalità, RGB, codice HEX, pipetta e colori rapidi.
                La palette del progetto può contenere fino a quindici colori e viene conservata nell’HTML esportato.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Che cos’è il Percorso essenziale?</summary>
            <div class="tutorial-answer">
              <p>
                La stellina <strong>Percorso essenziale</strong> contrassegna le capsule indispensabili.
                Nel visualizzatore permette di passare a una versione più sintetica della linea. È utile per
                differenziare il carico di lavoro, preparare un ripasso o offrire un percorso di base senza
                creare un secondo progetto.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-contenuti">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">03</span>
          <h3>Contenuti</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Come si scrive e si formatta il testo?</summary>
            <div class="tutorial-answer">
              <p>
                Apri il blocco <strong>Testo</strong> (chiamato <strong>Quesito</strong> nelle domande).
                Puoi applicare grassetto, corsivo, sottolineato, elenchi, collegamenti e dimensioni del carattere.
                Seleziona prima le parole da formattare. Per facilitare la lettura, usa titoli chiari,
                paragrafi brevi e informazioni davvero pertinenti alla data.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Quali modalità sono disponibili per le immagini?</summary>
            <div class="tutorial-answer">
              <p>
                Puoi scegliere <strong>immagine singola, carosello, griglia</strong> da 2 × 1 a 3 × 3 oppure
                <strong>confronto</strong> tra due immagini. I file caricati vengono integrati nell’HTML;
                gli indirizzi esterni lo rendono più leggero, ma richiedono Internet e potrebbero smettere
                di funzionare.
              </p>
              <p>
                Inserisci sempre il <strong>testo alternativo</strong>. Se l’interruttore è attivo, didascalia
                e fonte restano sotto l’immagine; se è disattivato, compaiono in sovrimpressione dopo circa
                un secondo di permanenza del mouse e subito con la tastiera. Immagini singole,
                caroselli e griglie si possono ingrandire a tutto schermo.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si aggiungono video e audio?</summary>
            <div class="tutorial-answer">
              <p>
                Per il video inserisci un collegamento a YouTube, Vimeo, a un file MP4/WebM o a un altro servizio:
                nel visualizzatore comparirà un pulsante che apre la risorsa esterna.
              </p>
              <p>
                Per l’audio puoi caricare un file, indicare un collegamento diretto oppure registrare dal microfono,
                se il browser lo consente. La registrazione può essere messa in pausa, ripresa e fermata.
                Nel visualizzatore viene usato un lettore essenziale con barra di avanzamento e indicazione del tempo.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si inserisce un luogo?</summary>
            <div class="tutorial-answer">
              <p>
                Scrivi il nome e incolla un indirizzo completo di Google Maps, OpenStreetMap o Apple Maps.
                Se il collegamento contiene le coordinate, CronoLab prova a compilare latitudine, longitudine e zoom.
                I link abbreviati spesso non contengono questi dati: aprili nel browser e copia l’indirizzo completo,
                oppure inserisci le coordinate manualmente. Puoi mostrare una mappa OpenStreetMap interattiva
                oppure lasciare soltanto il collegamento esterno.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Qual è la differenza tra collegamenti, rimandi e fonti?</summary>
            <div class="tutorial-answer">
              <p>
                I <strong>collegamenti esterni</strong> portano a materiali sul web; i
                <strong>collegamenti tra capsule</strong> creano rimandi interni alla linea; le
                <strong>fonti</strong> formano una breve bibliografia. I rimandi tra capsule sono biunivoci
                per impostazione predefinita, cioè vengono creati in entrambe le direzioni, ma puoi renderli
                unidirezionali. È possibile personalizzare le etichette; ciascuna capsula può contenere fino a quattro collegamenti verso un'altra capsula.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come funziona il Glossario?</summary>
            <div class="tutorial-answer">
              <p>
                Nel menu <strong>Strumenti → Glossario</strong> puoi associare una breve definizione a parole
                che potrebbero risultare difficili o ritieni importanti. Nel visualizzatore i termini vengono evidenziati e la spiegazione
                è disponibile senza abbandonare la linea. Nel PDF il Glossario può diventare un’appendice finale.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-attivita">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">04</span>
          <h3>Attività</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Quali attività posso creare?</summary>
            <div class="tutorial-answer">
              <p>
                Sono disponibili <strong>domanda aperta, scelta multipla, cloze, vero/falso, riordino</strong>
                e <strong>abbinamenti</strong>. Il cloze nasconde parole in un testo; nel riordino gli elementi
                vengono mescolati; negli abbinamenti ogni elemento deve essere associato alla voce corretta.
                Puoi aggiungere un suggerimento, che compare dopo il secondo tentativo sbagliato, e una spiegazione,
                che compare dopo che è stata data la risposta corretta.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come vengono corretti gli esercizi?</summary>
            <div class="tutorial-answer">
              <p>
                Per evitare che lo studente proceda per tentativi, in caso di errore CronoLab <strong>non indica
                quali risposte sono giuste e quali sbagliate</strong>: mostra soltanto che l’esercizio non è ancora
                corretto. Prima di poter controllare di nuovo bisogna attendere <strong>5 secondi</strong>, il tempo
                per rileggere. Dopo il secondo errore compare il suggerimento, se è stato scritto.
                Quando tutto è corretto, le risposte diventano verdi e compare la spiegazione.
              </p>
              <p class="tutorial-tip">
                Le attività servono all’autoverifica: chi sa aprire il codice di una pagina web può trovare le
                soluzioni. Per le verifiche valutate usa la scheda di lavoro stampata.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Che cosa fa una domanda bloccante?</summary>
            <div class="tutorial-answer">
              <p>
                Nasconde temporaneamente le capsule successive finché l’attività non viene completata correttamente.
                Per una domanda aperta, lo sblocco avviene quando viene mostrata la risposta. Questa funzione può
                trasformare la linea in un percorso guidato. Finché una domanda è bloccata i collegamenti tra una capsula
                precedente e una successiva alla domanda bloccata non funzionano. Se l’attività è incompleta e non può
                essere risolta, la domanda non blocca la linea: il <strong>Controllo completezza</strong> la segnala.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-visualizzatore">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">05</span>
          <h3>Visualizzatore</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Come si consulta la linea del tempo?</summary>
            <div class="tutorial-answer">
              <p>
                Le capsule partono chiuse e mostrano le informazioni essenziali; un clic le espande.
                La linea può essere orizzontale o verticale. Sono disponibili ricerca,
                filtri per categoria, tema chiaro/scuro, espansione o riduzione di tutte le capsule,
                Percorso essenziale e modalità Presentazione. L’intestazione può essere ridotta per lasciare
                più spazio ai contenuti.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>A cosa serve la Mappa di navigazione?</summary>
            <div class="tutorial-answer">
              <p>
                Rappresenta tutte le capsule raggiungibili come punti del loro colore. Selezionando un punto,
                la vista raggiunge la capsula corrispondente senza aprirla. La mappa è sotto
                la linea nella vista orizzontale e a sinistra in quella verticale; può essere mostrata o nascosta
                dal menu <strong>Vista</strong>.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Che cos’è la Visione sincronica?</summary>
            <div class="tutorial-answer">
              <p>
                È uno sguardo sintetico che dispone in parallelo le capsule delle categorie abilitate nelle
                <strong>Impostazioni</strong>. Mostra soltanto titolo, data e colore, non permette interazioni ed
                esclude le capsule senza data o senza categoria. Se una capsula appartiene a più categorie abilitate,
                viene ripetuta nelle rispettive corsie. L’orientamento segue quello della linea normale. È utile per confrontare
                nello stesso periodo eventi di paesi, discipline o percorsi diversi.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Che cos’è la scala dei tempi proporzionale?</summary>
            <div class="tutorial-answer">
              <p>
                Nella vista orizzontale le capsule possono essere messe una dopo l’altra (<strong>sequenza</strong>)
                oppure a una distanza che corrisponde agli anni trascorsi (<strong>proporzionale</strong>), con un
                righello di date sotto la linea. Si cambia dal menu <strong>Vista</strong> (l’icona con l’occhio); in <strong>Impostazioni</strong>
                scegli la scala con cui la linea si apre. Le capsule vicine nel tempo vengono disposte su più file;
                quelle senza data seguono, in fila, la capsula datata che le precede. Finché una domanda
                bloccante non è risolta, la scala si ferma all’ultima capsula visibile e i periodi che continuano
                oltre sfumano. Nella vista verticale e sugli schermi
                piccoli la linea torna in sequenza.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Quali opzioni di lettura ci sono?</summary>
            <div class="tutorial-answer">
              <p>
                Il pulsante <strong>Aa</strong> permette a chi legge di ingrandire il testo, aumentare l’interlinea,
                usare il carattere ad alta leggibilità <strong>Atkinson Hyperlegible</strong> e scegliere la velocità
                della lettura ad alta voce. Le scelte vengono ricordate dal browser.
              </p>
              <p>
                Il pulsante <strong>Ascolta</strong> in ogni capsula legge titolo, data, testo e, negli esercizi, le
                opzioni da scegliere. Usa le voci installate sul dispositivo: la qualità cambia da un computer all’altro,
                e senza voce italiana viene usata quella predefinita.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Che cos’è il riepilogo per lo studente?</summary>
            <div class="tutorial-answer">
              <p>
                Il pulsante con la lista spuntata apre un <strong>riepilogo</strong> del lavoro svolto: esercizi
                completati, completati al primo tentativo, domande aperte consultate, capsule aperte e, per ogni
                esercizio, esito e numero di tentativi. Lo studente scrive nome e cognome e può stamparlo o salvarlo
                in PDF da consegnare. Il riepilogo riguarda solo la sessione in corso: ricaricando la pagina riparte da zero.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si controlla il risultato prima di condividerlo?</summary>
            <div class="tutorial-answer">
              <p>
                Usa <strong>Anteprima</strong> e prova entrambe le visualizzazioni. Verifica apertura delle capsule,
                domande bloccanti, filtri, ricerca, fasce dei periodi, Mappa di navigazione, Visione sincronica,
                immagini ingrandite, collegamenti, audio, video e mappe.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-esportazione">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">06</span>
          <h3>Esportazione</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Come si esporta e si riapre l’HTML interattivo?</summary>
            <div class="tutorial-answer">
              <p>
                <strong>Esporta HTML interattivo</strong> crea un unico file pronto per la consultazione e conserva
                anche i dati dell’editor. Per modificarlo, torna in CronoLab, scegli <strong>Apri</strong> e seleziona
                quel file. Le immagini integrate e gli audio caricati restano nel file; le risorse collegate
                richiedono Internet.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>A cosa serve Esporta JSON e come si riapre?</summary>
            <div class="tutorial-answer">
              <p>
                <strong>Esporta JSON</strong> salva in un file strutturato tutti i dati del progetto CronoLab:
                impostazioni, capsule, categorie, collegamenti, Glossario, attività e contenuti integrati.
                È quindi adatto come copia di sicurezza o per trasferire il progetto senza usare la pagina HTML.
              </p>
              <p>
                Per riaprirlo scegli <strong>Apri</strong> e seleziona il file <strong>.json</strong>. Lo stesso comando
                <strong>Apri</strong> accetta anche file <strong>.html</strong> CronoLab e file <strong>.csv</strong>.
                L’HTML e il JSON ripristinano un progetto completo; il CSV è invece pensato soprattutto per
                importare capsule e dati essenziali.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Quali PDF posso preparare?</summary>
            <div class="tutorial-answer">
              <p>
                <strong>Esporta PDF</strong> offre linea multipagina, poster panoramico e Visione sincronica.
                Puoi scegliere A4, A3 o A2, orientamento, capsule sintetiche o complete, tutte le capsule o
                il Percorso essenziale, versione studente/docente, Includi immagini, Glossario in appendice,
                Scala di grigi e Intestazione e numeri di pagina. Nella linea multipagina completa i collegamenti e
                i video possono essere stampati anche come <strong>codici QR</strong>, da inquadrare con il telefono.
              </p>
              <p>
                Le due <strong>schede di lavoro</strong> sono pensate per la classe: in <strong>Scheda: completa le date</strong>
                lo studente scrive la data di ogni evento; in <strong>Scheda: ritaglia e riordina</strong> ritaglia le
                schede degli eventi, senza date, e le incolla in ordine cronologico. In entrambe le schede le date scritte nei testi
                vengono sostituite da […]. Si può aggiungere una pagina con le soluzioni per il docente.
              </p>
              <p>
                La versione docente include le risposte alle capsule domanda, mentre suggerimenti e spiegazioni sono visibili.
                Nella versione studente le capsule domande sono visibili, ma la risposta corretta, suggerimenti e spiegazioni sono nascoste. 
              </p>
              <p>
                Nella linea multipagina le capsule restano intere quando possibile; quelle più lunghe di una pagina
                sono divise soltanto tra blocchi. Il poster viene bloccato se risulta troppo denso.
                Controlla il file prodotto, usa <strong>Stampa o salva PDF</strong> e scegli “Salva come PDF” nel browser.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si importano capsule da un CSV?</summary>
            <div class="tutorial-answer">
              <p>
                Da <strong>Apri</strong> puoi selezionare un CSV; CronoLab riconosce punto e virgola, virgola
                o tabulazione e chiede se aggiungere le capsule o sostituire quelle presenti. Le categorie mancanti
                vengono create automaticamente. Per assegnare più categorie nella colonna <strong>categoria</strong>,
                separa i nomi con <strong>||</strong>. La colonna <strong>colore</strong> imposta il colore della capsula,
                mentre <strong>categoria_colore</strong> (facoltativa) quello delle categorie create.
              </p>
              <p>
                Il CSV è pensato soprattutto per i dati essenziali e non rappresenta fedelmente tutte le funzioni
                avanzate. Per un salvataggio completo usa l’<strong>HTML CronoLab</strong> oppure <strong>Esporta JSON</strong>.
              </p>
              <p><button class="tutorial-inline-action" type="button" data-download-csv>Scarica il modello CSV</button></p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si collegano CronoLab e MapLab?</summary>
            <div class="tutorial-answer">
              <p>
                Da <strong>Strumenti › Importa da MapLab</strong>, oppure da <strong>Apri</strong>, puoi scegliere un file
                HTML esportato da MapLab. Gli elementi della mappa che hanno una data diventano capsule con titolo,
                testo, immagine e categoria. Gli elementi senza data non vengono importati e sono elencati in un avviso.
              </p>
              <p>
                In MapLab, il pulsante <strong>Importa da CronoLab</strong> nella scheda Elenco fa il percorso inverso:
                le capsule diventano puntine, raccolte in alto a sinistra della carta, da trascinare nel punto giusto.
                Le capsule domanda non vengono importate.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si può condividere una linea?</summary>
            <div class="tutorial-answer">
              <p>
                Puoi inviare il file HTML, conservarlo in locale, pubblicarlo con un servizio che ospita pagine web
                oppure usare il PDF per stampa e distribuzione. Prima di condividere controlla
                <strong>diritti d’uso, fonti, dati personali, accessibilità</strong> e funzionamento dei link esterni.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-didattica">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">07</span>
          <h3>Uso didattico</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Quale idea didattica c’è dietro CronoLab?</summary>
            <div class="tutorial-answer">
              <p>
                Una linea del tempo non serve soltanto a ricordare date: rende visibili <strong>successioni,
                durate, contemporaneità, cambiamenti e relazioni</strong>. Le capsule permettono di alternare
                informazioni, fonti e attività, così chi studia può ricostruire un percorso invece di leggere
                un semplice elenco cronologico.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come può essere usato CronoLab in classe?</summary>
            <div class="tutorial-answer">
              <ul>
                <li>Come supporto a una spiegazione, usando la modalità <strong>Presentazione</strong>.</li>
                <li>Per confrontare processi paralleli con categorie e <strong>Visione sincronica</strong>.</li>
                <li>Per un lavoro di gruppo in cui ogni gruppo cura una categoria, un periodo o alcune fonti.</li>
                <li>Per una verifica formativa, alternando contenuti ed esercizi con spiegazione.</li>
                <li>Per discutere attendibilità, selezione e citazione delle fonti.</li>
              </ul>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come può essere usato a casa?</summary>
            <div class="tutorial-answer">
              <p>
                Può diventare un percorso di studio autonomo, un ripasso tramite il Percorso essenziale oppure
                una consegna da completare e discutere in seguito. Se il file deve funzionare senza connessione,
                integra immagini e audio e non affidare informazioni indispensabili a video, mappe o link esterni.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come rendere la linea più accessibile e leggibile?</summary>
            <div class="tutorial-answer">
              <p>
                Usa testi alternativi per le immagini, titoli brevi, paragrafi chiari e collegamenti con etichette comprensibili. 
                Non affidare un significato soltanto al colore. Evita capsule troppo dense e verifica che tastiera, schermo piccolo e PDF offrano
                comunque un percorso comprensibile.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Posso usare liberamente CronoLab?</summary>
            <div class="tutorial-answer">
              <p>
                CronoLab è un progetto ideato e realizzato da Tommaso Sereni. 
                Può essere <strong>utilizzato liberamente</strong> per scopi personali, didattici e professionali.
              </p>
              <p>
                Chi utilizza CronoLab è responsabile dei contenuti che crea, modifica, importa, esporta o condivide tramite lo strumento. 
                L’autore di CronoLab <strong>non è responsabile dei contenuti prodotti dagli utenti né dell’uso che ne viene fatto</strong>.
              </p>
              <p>
                CronoLab viene messo a disposizione liberamente e può essere utilizzato e condiviso, mantenendo il riferimento al progetto e al suo autore.
              </p>
              <p>
                CronoLab include componenti di terze parti: React (licenza MIT), le icone Lucide (licenza ISC),
                la libreria qrcode-generator di Kazuhiko Arase (licenza MIT) e il carattere Atkinson Hyperlegible
                del Braille Institute (SIL Open Font License 1.1).
              </p>
            </div>
          </details>
          
          <details class="tutorial-faq">
            <summary>Come posso segnalare un errore, dare un suggerimento o chiedere informazioni?</summary>
            <div class="tutorial-answer">
              <p>
                Per segnalazioni, suggerimenti o richieste di informazioni puoi scrivere a
                <a href="mailto:tms.sereni@gmail.com">tms.sereni@gmail.com</a>.
                Se segnali un errore, indica possibilmente il browser usato e i passaggi che lo hanno prodotto.
              </p>
              <p>Le mappe utilizzano dati © OpenStreetMap contributors.</p>
            </div>
          </details>
        </div>
      </section>
    </article>

        <li>Migliorati il selettore dei colori, la palette e i collegamenti tra capsule; aggiunta la funzione Ordina manualmente.</li>
      </ul>
      <h4>Contenuti e attività</h4>
      <ul>
        <li>Aggiunto il blocco <strong>Audio</strong>, con file, collegamento, registrazione e lettore dedicato.</li>
        <li>Esteso il blocco <strong>Immagine</strong> con carosello, griglie, confronto, didascalie in sovrimpressione e vista a tutto schermo.</li>
        <li>Aggiunti esercizi cloze, vero/falso, riordino e abbinamenti, oltre a suggerimenti e spiegazioni.</li>
        <li>Migliorati Luogo, mappe, Fonti, Collegamenti esterni e rimandi interni biunivoci.</li>
      </ul>
      <h4>Visualizzatore ed esportazione</h4>
      <ul>
        <li>Rinnovata la navigazione orizzontale e verticale, con ricerca, filtri, <strong>Presentazione</strong> e intestazione riducibile.</li>
        <li>Aggiunte <strong>Mappa di navigazione</strong> e <strong>Visione sincronica</strong> per categorie.</li>
        <li>Migliorate fasce dei periodi, domande bloccanti e visualizzazione del <strong>Percorso essenziale</strong>.</li>
        <li>Introdotta la funzione <strong>Esporta PDF</strong>, con linea multipagina, poster, Visione sincronica e controlli di leggibilità.</li>
        <li>Aggiunti logo, favicon e <strong>Tutorial</strong> in formato FAQ con pagina delle novità.</li>
      </ul>

/* Opzioni di lettura */
.reading-toggle{min-width:40px;padding-inline:9px;font-family:Georgia,"Times New Roman",serif;font-size:1rem;font-weight:700;letter-spacing:.01em}
.reading-panel{width:260px;gap:6px;padding:12px}
.reading-heading{margin:4px 2px 0;color:var(--muted);font-size:.66rem;font-weight:850;text-transform:uppercase;letter-spacing:.07em}
.reading-choices{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.reading-choices button{flex:1;min-height:34px;border:0;border-radius:8px;background:transparent;color:var(--text);font:inherit;font-size:.74rem;font-weight:760;cursor:pointer;padding:5px 6px}
.reading-choices button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px color-mix(in srgb,var(--text) 16%,transparent)}
.reading-legible-sample{font-family:"Atkinson Hyperlegible",var(--font)!important}
body.reading-legible{--font:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;--display:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif}
body.reading-size-1{--rs:1.15}
body.reading-size-2{--rs:1.32}
body.reading-size-1 .rich,body.reading-size-2 .rich{font-size:calc(.91rem*var(--rs))}
body.reading-size-1 .capsule-title,body.reading-size-2 .capsule-title{font-size:calc(1.22rem*var(--rs))}
body.reading-size-1 .quiz-option,body.reading-size-2 .quiz-option,body.reading-size-1 .tf-statement,body.reading-size-2 .tf-statement,body.reading-size-1 .ordering-item,body.reading-size-2 .ordering-item,body.reading-size-1 .matching-row,body.reading-size-2 .matching-row,body.reading-size-1 .matching-row strong,body.reading-size-2 .matching-row strong{font-size:calc(.88rem*var(--rs))}
body.reading-size-1 .cover-intro,body.reading-size-2 .cover-intro,body.reading-size-1 .cover-subtitle,body.reading-size-2 .cover-subtitle,body.reading-size-1 .resource,body.reading-size-2 .resource,body.reading-size-1 .quiz-feedback,body.reading-size-1 .blocking-note,body.reading-size-2 .quiz-feedback,body.reading-size-2 .blocking-note{font-size:calc(.84rem*var(--rs))}
body.reading-size-1 .present-card .rich,body.reading-size-2 .present-card .rich{font-size:calc(clamp(1rem,1.7vw,1.3rem)*var(--rs))}
body.reading-size-1 .present-card .capsule-title,body.reading-size-2 .present-card .capsule-title{font-size:calc(clamp(2rem,5vw,4rem)*min(var(--rs),1.15))}
body.reading-wide .rich,body.reading-wide .quiz-option,body.reading-wide .tf-statement,body.reading-wide .ordering-item,body.reading-wide .matching-row,body.reading-wide .cover-intro,body.reading-wide .cloze-passage{line-height:1.9;letter-spacing:.035em;word-spacing:.14em}
body.reading-wide .rich p{margin-block:.9em}
body.reading-wide .cloze-passage{line-height:2.6}

/* Lettura ad alta voce */
.tts-button{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;min-height:32px;padding:4px 11px 4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--text);font:inherit;font-size:.74rem;font-weight:780;cursor:pointer}
.tts-button .ui-icon{width:17px;height:17px;color:var(--item-color,var(--accent))}
.tts-button:hover{border-color:color-mix(in srgb,var(--item-color,var(--accent)) 55%,var(--line))}
.tts-button.speaking{background:var(--item-color,var(--accent));border-color:var(--item-color,var(--accent));color:#fff}
.tts-button.speaking .ui-icon{color:#fff}
.present-card .tts-button{margin-top:4px}

/* Riepilogo del lavoro */
.summary-view{position:fixed;inset:0;z-index:180;display:none;overflow:auto;padding:clamp(12px,4vw,48px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.summary-view.open{display:block}
.summary-sheet{max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-top:7px solid var(--accent);border-radius:calc(var(--radius) + 2px);box-shadow:var(--shadow);padding:clamp(18px,3vw,34px)}
.summary-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.summary-kicker{margin:0;color:var(--accent);font-size:.7rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
.summary-head h2{margin:4px 0 0;font-family:var(--display);font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.15}
.summary-identity{margin:18px 0 6px}
.summary-identity label{display:grid;gap:5px;max-width:420px}
.summary-identity label span{font-size:.74rem;font-weight:800;color:var(--muted)}
.summary-identity input{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:10px 12px;font-size:.95rem}
.summary-print-name{display:none;margin:0;font-weight:800}
.summary-meta{margin:10px 0 0;color:var(--muted);font-size:.8rem}
.summary-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
.summary-stat{display:grid;gap:3px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.summary-stat strong{font-size:1.7rem;line-height:1;color:var(--accent)}
.summary-stat strong small{font-size:.85rem;color:var(--muted);font-weight:750}
.summary-stat span{font-size:.78rem;font-weight:700;color:var(--text)}
.summary-table{width:100%;border-collapse:collapse;font-size:.84rem}
.summary-table th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 8px;border-bottom:2px solid var(--line)}
.summary-table td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.summary-table tr.done td:last-child{color:#258249;font-weight:750}
.summary-table tr.todo td:last-child{color:var(--muted)}
.summary-empty,.summary-note{color:var(--muted);font-size:.8rem}
.summary-note{margin:16px 0 0}
.summary-actions{display:flex;justify-content:flex-end;margin-top:16px}
@media print{
  body.print-summary>*:not(#summary-view){display:none!important}
  body.print-summary{--bg:#fff;--surface:#fff;--surface-2:#fff;--text:#111;--muted:#444;--line:#c9ccd3;background:#fff;color:#000}
  body.print-summary #summary-view{position:static;display:block!important;padding:0;background:#fff;backdrop-filter:none;overflow:visible}
  body.print-summary .summary-sheet{border:0;box-shadow:none;padding:0;max-width:none;background:#fff;color:#000}
  body.print-summary .summary-close,body.print-summary .summary-actions,body.print-summary .summary-identity label{display:none!important}
  body.print-summary .summary-print-name{display:block}
  body.print-summary .summary-stat{background:#fff}
}

/* Scala dei tempi proporzionale */
.timeline-stage.scale-proportional .timeline-items{display:block;min-width:0;padding:0}
.timeline-stage.scale-proportional .timeline-items:before{left:var(--axis-start,84px);right:var(--axis-end,84px)}
.timeline-stage.scale-proportional .timeline-item{position:absolute;top:0;width:300px;flex:none;transition:none}
.timeline-stage.scale-proportional .timeline-item.expanded-item{width:300px;z-index:30}
.timeline-stage.scale-proportional .timeline-item.period-anchor{display:none}
.timeline-stage.scale-proportional .capsule{width:min(290px,84vw);bottom:calc(100% - var(--line-y) + 40px + var(--lane,0)*var(--lane-step,150px))}
.timeline-stage.scale-proportional .capsule.expanded{width:min(640px,90vw)}
.timeline-stage.scale-proportional .timeline-item:after{height:calc(40px + var(--lane,0)*var(--lane-step,150px))}
.timeline-stage.scale-proportional .timeline-item.undated:before{display:none}
.timeline-stage.scale-proportional .timeline-item.undated:after{display:none}
.scale-tick{position:absolute;transform:translateX(-50%);padding-top:9px;color:var(--muted);font-size:.66rem;font-weight:780;white-space:nowrap;pointer-events:none}
.scale-tick:before{content:"";position:absolute;left:50%;top:0;width:2px;height:7px;border-radius:2px;background:color-mix(in srgb,var(--muted) 55%,transparent)}
.btn[data-action="scale"].active{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.timeline-stage.scale-proportional .timeline-item{pointer-events:none}
.timeline-stage.scale-proportional .timeline-item .capsule{pointer-events:auto}
.timeline-stage.scale-proportional .timeline-item:after{z-index:1}
.timeline-stage.scale-proportional .timeline-item .capsule{z-index:3}
.timeline-stage.scale-proportional .timeline-item.expanded-item .capsule{z-index:8}
/* Tema scuro: etichette colorate più chiare, per un contrasto sufficiente sullo sfondo scuro */
.dark .type-pill,.dark .cover-kicker,.dark .summary-kicker{color:color-mix(in srgb,var(--item-color,var(--accent)) 55%,#fff)}
/* Periodo che prosegue oltre una domanda bloccante ancora da risolvere */
.timeline-stage.scale-proportional .period-band.cut{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 70px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 70px),transparent)}
