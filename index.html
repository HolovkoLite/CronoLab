<style>:root{--ink:#202532;--muted:#667085;--soft:#f3f5fa;--paper:#fff;--line:#e2e6ef;--brand:#5b5bd6;--brand-dark:#4444bc;--green:#14866d;--orange:#bf6a2c;--red:#c7475c;--shadow:0 18px 55px rgba(37,43,66,.1);--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef1f7;color:var(--ink);font-family:var(--font)}button,input,select,textarea{font:inherit}button{color:inherit}.icon{width:19px;height:19px;flex:none}.app-shell{min-height:100vh}.loading{min-height:100vh;display:grid;place-content:center;text-align:center;gap:14px;color:var(--muted)}.brand-orbit{width:66px;height:66px;margin:auto;display:grid;place-items:center;border-radius:22px;background:var(--brand);color:#fff;font-size:30px;box-shadow:0 18px 40px #5b5bd64d;animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{transform:translateY(-4px)}}.app-header{height:74px;background:#ffffffed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;position:sticky;top:0;z-index:40}.brand-lockup{display:flex;align-items:center;gap:11px;min-width:230px;margin-right:auto}

<body>
<!--
  CONTENUTO DEL TUTORIAL
  Puoi modificare testi, titoli, grassetti e collegamenti direttamente nei tag HTML qui sotto.
  Non cambiare gli attributi id, href e data-tutorial-page: servono alla navigazione.
-->
<template id="cronolab-tutorial-content">
  <div class="tutorial-layout">
    <aside class="tutorial-menu" aria-label="Sezioni del Tutorial">
      <p class="tutorial-menu-title">In questa pagina</p>
      <nav>
        <a href="#tutorial-primi-passi">Primi passi</a>
        <a href="#tutorial-capsule">Capsule e date</a>
        <a href="#tutorial-contenuti">Contenuti</a>
        <a href="#tutorial-attivita">Attività</a>
        <a href="#tutorial-visualizzatore">Visualizzatore</a>
        <a href="#tutorial-esportazione">Esportazione</a>
        <a href="#tutorial-didattica">Uso didattico</a>
      </nav>
    </aside>

    <article class="tutorial-content">
      <header class="tutorial-intro" id="tutorial-inizio">
        <p class="tutorial-kicker">Tutorial</p>
        <h2>Creare e usare una linea del tempo con CronoLab</h2>
        <p>
          CronoLab è uno strumento per progettare <strong>linee del tempo didattiche interattive</strong>,
          arricchite con testi, immagini, fonti, luoghi ed esercizi
          (<a class="tutorial-version-link" href="#" data-tutorial-page="changes">versione 0.2</a>).
        </p>
        <p class="tutorial-beta">
          <strong>CronoLab è ancora in versione beta.</strong> Potrebbero quindi esserci errori e alcune funzioni
          potrebbero cambiare, essere spostate o venire migliorate da un momento all’altro.
        </p>
      </header>

      <section class="tutorial-section" id="tutorial-primi-passi">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">01</span>
          <h3>Primi passi</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Da dove conviene iniziare?</summary>
            <div class="tutorial-answer">
              <p>
                Puoi partire da un progetto vuoto, selezionare <strong>Apri un esempio</strong> dal menu
                <strong>Strumenti</strong> oppure riaprire un file HTML creato in precedenza. In
                <strong>Impostazioni</strong> inserisci titolo, sottotitolo, introduzione, autore, classe e materia,
                quindi scegli tema, colore principale e orientamento iniziale.
              </p>
              <p class="tutorial-tip">
                Per prendere confidenza con CronoLab, prova prima a creare tre capsule: un evento,
                un approfondimento e una domanda.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si sceglie l’aspetto della linea?</summary>
            <div class="tutorial-answer">
              <p>
                In <strong>Impostazioni</strong> puoi scegliere i temi Essenziale, Quaderno o Archivio,
                il colore principale e la vista iniziale orizzontale o verticale. Nel visualizzatore chi consulta
                la linea può passare dal tema chiaro a quello scuro e cambiare orientamento; sugli schermi piccoli
                CronoLab privilegia automaticamente la vista verticale.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Il lavoro viene salvato automaticamente?</summary>
            <div class="tutorial-answer">
              <p>
                No. Il progetto rimane nel browser soltanto mentre lavori. Usa regolarmente
                <strong>Esporta → Esporta HTML interattivo</strong>: il file ottenuto è sia la linea da condividere,
                sia la copia che potrai riaprire nell’editor con <strong>Apri</strong>.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come funzionano Annulla e Ripristina?</summary>
            <div class="tutorial-answer">
              <p>
                CronoLab conserva le ultime <strong>30 azioni</strong> del progetto aperto. Puoi usare i pulsanti
                nella barra superiore oppure le scorciatoie <strong>Ctrl/Cmd+Z</strong>,
                <strong>Ctrl/Cmd+Maiusc+Z</strong> e <strong>Ctrl/Cmd+Y</strong>. Quando apri un altro progetto,
                la cronologia riparte da zero.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>A cosa servono gli strumenti di controllo?</summary>
            <div class="tutorial-answer">
              <p>
                Nel menu <strong>Strumenti</strong> trovi Glossario, Controllo completezza e Apri un esempio.
                Il <strong>Controllo completezza</strong> segnala campi mancanti o contenuti da rivedere:
                non sostituisce la revisione didattica, ma aiuta a individuare rapidamente dimenticanze.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-capsule">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">02</span>
          <h3>Capsule e date</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Che cos’è una capsula e quali tipi esistono?</summary>
            <div class="tutorial-answer">
              <p>
                Una capsula è l’unità di contenuto della linea. <strong>Evento</strong> descrive un fatto;
                <strong>Periodo</strong> rappresenta una durata; <strong>Approfondimento</strong> aggiunge un
                commento, un documento o un contesto; <strong>Domanda</strong> propone un’attività.
                Le capsule possono essere duplicate, eliminate e riordinate.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Quali date posso inserire?</summary>
            <div class="tutorial-answer">
              <p>
                Puoi usare giorno, mese e anno; solo anno; intervallo; secolo; oppure nessuna data.
                Sono disponibili date a.C., indicazione approssimativa ed etichetta personalizzata.
                L’etichetta cambia ciò che si legge, ma non il punto usato per l’ordinamento.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come vengono mostrati i periodi?</summary>
            <div class="tutorial-answer">
              <p>
                Un periodo richiede una data iniziale e una finale. Nel visualizzatore appare come una
                fascia parallela alla linea; periodi sovrapposti occupano corsie diverse.
                Puoi decidere se mostrare anche la relativa capsula. Se la capsula è nascosta, la fascia resta
                un riferimento visivo ma non è selezionabile.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Quando usare una capsula senza data?</summary>
            <div class="tutorial-answer">
              <p>
                È utile per consegne, fonti generali, commenti o domande che non appartengono a un momento preciso.
                Nell’ordinamento automatico resta vicina all’ultimo elemento datato che la precede.
                Le capsule senza data non compaiono nella <strong>Visione sincronica</strong>.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si decide l’ordine delle capsule?</summary>
            <div class="tutorial-answer">
              <p>
                <strong>Ordina per data</strong> costruisce la sequenza cronologica. Con
                <strong>Ordina manualmente</strong> puoi invece progettare un percorso personale trascinando
                le capsule o usando le frecce; durante questa modalità i contenuti non sono modificabili.
                Premi <strong>Fatto</strong> per tornare all’editor.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come funzionano categorie e colori?</summary>
            <div class="tutorial-answer">
              <p>
                Ogni capsula può appartenere a una categoria; le categorie usate diventano filtri nel visualizzatore
                e organizzano le corsie della Visione sincronica. Il colore della capsula segue questa priorità:
                <strong>colore personalizzato, poi colore del tipo</strong>. Il colore della categoria non sostituisce
                quello della capsula.
              </p>
              <p>
                Il selettore consente di usare spettro, tonalità, RGB, codice HEX, pipetta e colori rapidi.
                La palette del progetto può contenere fino a quindici colori e viene conservata nell’HTML esportato.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Che cos’è il Percorso essenziale?</summary>
            <div class="tutorial-answer">
              <p>
                La stellina <strong>Percorso essenziale</strong> contrassegna le capsule indispensabili.
                Nel visualizzatore permette di passare a una versione più sintetica della linea. È utile per
                differenziare il carico di lavoro, preparare un ripasso o offrire un percorso di base senza
                creare un secondo progetto.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-contenuti">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">03</span>
          <h3>Contenuti</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Come si scrive e si formatta il testo?</summary>
            <div class="tutorial-answer">
              <p>
                Apri il blocco <strong>Testo</strong> (chiamato <strong>Quesito</strong> nelle domande).
                Puoi applicare grassetto, corsivo, sottolineato, elenchi, collegamenti e dimensioni del carattere.
                Seleziona prima le parole da formattare. Per facilitare la lettura, usa titoli chiari,
                paragrafi brevi e informazioni davvero pertinenti alla data.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Quali modalità sono disponibili per le immagini?</summary>
            <div class="tutorial-answer">
              <p>
                Puoi scegliere <strong>immagine singola, carosello, griglia</strong> da 2 × 1 a 3 × 3 oppure
                <strong>confronto</strong> tra due immagini. I file caricati vengono integrati nell’HTML;
                gli indirizzi esterni lo rendono più leggero, ma richiedono Internet e potrebbero smettere
                di funzionare.
              </p>
              <p>
                Inserisci sempre il <strong>testo alternativo</strong>. Se l’interruttore è attivo, didascalia
                e fonte restano sotto l’immagine; se è disattivato, compaiono in sovrimpressione dopo circa
                un secondo di permanenza del mouse e subito con la tastiera. Nel visualizzatore immagini singole,
                caroselli e griglie si possono ingrandire a tutto schermo.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si aggiungono video e audio?</summary>
            <div class="tutorial-answer">
              <p>
                Per il video inserisci un collegamento a YouTube, Vimeo, a un file MP4/WebM o a un altro servizio:
                nel visualizzatore comparirà un pulsante che apre la risorsa esterna.
              </p>
              <p>
                Per l’audio puoi caricare un file, indicare un collegamento diretto oppure registrare dal microfono,
                se il browser lo consente. La registrazione può essere messa in pausa, ripresa e fermata.
                Nel visualizzatore viene usato un lettore essenziale con barra di avanzamento e indicazione del tempo.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si inserisce un luogo?</summary>
            <div class="tutorial-answer">
              <p>
                Scrivi il nome e incolla un indirizzo completo di Google Maps, OpenStreetMap o Apple Maps.
                Se il collegamento contiene le coordinate, CronoLab prova a compilare latitudine, longitudine e zoom.
                I link abbreviati spesso non contengono questi dati: aprili nel browser e copia l’indirizzo completo,
                oppure inserisci le coordinate manualmente. Puoi mostrare una mappa OpenStreetMap interattiva
                oppure lasciare soltanto il collegamento esterno.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Qual è la differenza tra collegamenti, rimandi e fonti?</summary>
            <div class="tutorial-answer">
              <p>
                I <strong>collegamenti esterni</strong> portano a materiali sul web; i
                <strong>collegamenti tra capsule</strong> creano rimandi interni alla linea; le
                <strong>fonti</strong> formano una breve bibliografia. I rimandi tra capsule sono biunivoci
                per impostazione predefinita, cioè vengono creati in entrambe le direzioni, ma puoi renderli
                unidirezionali. È possibile personalizzare le etichette e inserire fino a quattro collegamenti.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come funziona il Glossario?</summary>
            <div class="tutorial-answer">
              <p>
                Nel menu <strong>Strumenti → Glossario</strong> puoi associare una breve definizione a parole
                che potrebbero risultare difficili. Nel visualizzatore i termini vengono evidenziati e la spiegazione
                è disponibile senza abbandonare la linea. Nel PDF il Glossario può diventare un’appendice finale.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-attivita">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">04</span>
          <h3>Attività</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Quali attività posso creare?</summary>
            <div class="tutorial-answer">
              <p>
                Sono disponibili <strong>domanda aperta, scelta multipla, cloze, vero/falso, riordino</strong>
                e <strong>abbinamenti</strong>. Il cloze nasconde parole in un testo; nel riordino gli elementi
                vengono mescolati; negli abbinamenti ogni elemento deve essere associato alla voce corretta.
                Puoi aggiungere suggerimento e spiegazione.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Che cosa fa una domanda bloccante?</summary>
            <div class="tutorial-answer">
              <p>
                Nasconde temporaneamente le capsule successive finché l’attività non viene completata correttamente.
                Per una domanda aperta, lo sblocco avviene quando viene mostrata la risposta. Questa funzione può
                trasformare la linea in un percorso guidato, ma va usata con misura.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si progettano attività utili e non solo di controllo?</summary>
            <div class="tutorial-answer">
              <p>
                Alterna domande di memoria ad attività che chiedano di <strong>confrontare, ordinare, formulare
                ipotesi o collegare cause e conseguenze</strong>. Colloca l’esercizio vicino ai contenuti necessari
                per rispondere e usa la spiegazione finale per chiarire il ragionamento, non soltanto la soluzione.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-visualizzatore">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">05</span>
          <h3>Visualizzatore</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Come si consulta la linea del tempo?</summary>
            <div class="tutorial-answer">
              <p>
                Le capsule partono chiuse e mostrano le informazioni essenziali; un clic le espande.
                La linea può essere orizzontale o verticale. Sono disponibili ricerca,
                filtri per categoria, tema chiaro/scuro, espansione o riduzione di tutte le capsule,
                Percorso essenziale e modalità Presentazione. L’intestazione può essere ridotta per lasciare
                più spazio ai contenuti.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>A cosa serve la Mappa di navigazione?</summary>
            <div class="tutorial-answer">
              <p>
                Rappresenta tutte le capsule raggiungibili come punti del loro colore. Selezionando un punto,
                la vista raggiunge la capsula corrispondente senza aprirla. La mappa è sotto
                la linea nella vista orizzontale e a sinistra in quella verticale; può essere mostrata o nascosta
                dal menu <strong>Vista</strong>.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Che cos’è la Visione sincronica?</summary>
            <div class="tutorial-answer">
              <p>
                È uno sguardo sintetico che dispone in parallelo le capsule delle diverse categorie.
                Mostra soltanto titolo, data e colore, non permette interazioni ed esclude le
                capsule senza data. L’orientamento segue quello della linea normale. È utile per confrontare
                nello stesso periodo eventi di paesi, discipline o percorsi diversi.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si controlla il risultato prima di condividerlo?</summary>
            <div class="tutorial-answer">
              <p>
                Usa <strong>Anteprima</strong> e prova entrambe le visualizzazioni. Verifica apertura delle capsule,
                domande bloccanti, filtri, ricerca, fasce dei periodi, Mappa di navigazione, Visione sincronica,
                immagini ingrandite, collegamenti, audio, video e mappe. Fai almeno una prova anche su uno
                schermo piccolo.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-esportazione">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">06</span>
          <h3>Esportazione</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Come si esporta e si riapre l’HTML interattivo?</summary>
            <div class="tutorial-answer">
              <p>
                <strong>Esporta HTML interattivo</strong> crea un unico file pronto per la consultazione e conserva
                anche i dati dell’editor. Per modificarlo, torna in CronoLab, scegli <strong>Apri</strong> e seleziona
                quel file. Le immagini integrate e gli audio caricati restano nel file; le risorse collegate
                richiedono Internet.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Quali PDF posso preparare?</summary>
            <div class="tutorial-answer">
              <p>
                <strong>Esporta PDF</strong> offre linea multipagina, poster panoramico e Visione sincronica.
                Puoi scegliere A4, A3 o A2, orientamento, capsule sintetiche o complete, tutte le capsule o
                il Percorso essenziale, versione studente/docente, Includi immagini, Glossario in appendice,
                Scala di grigi e Intestazione e numeri di pagina.
              </p>
              <p>
                Nella linea multipagina le capsule restano intere quando possibile; quelle più lunghe di una pagina
                sono divise soltanto tra blocchi. Il poster viene bloccato se risulterebbe troppo denso.
                Dopo il controllo, usa <strong>Stampa o salva PDF</strong> e scegli “Salva come PDF” nel browser.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si importano capsule da un CSV?</summary>
            <div class="tutorial-answer">
              <p>
                Da <strong>Apri</strong> puoi selezionare un CSV; CronoLab riconosce punto e virgola, virgola
                o tabulazione e chiede se aggiungere le capsule o sostituire quelle presenti. Le categorie mancanti
                vengono create automaticamente.
              </p>
              <p>
                Il CSV è pensato soprattutto per i dati essenziali e non rappresenta fedelmente tutte le funzioni
                avanzate. Per un salvataggio completo usa sempre l’HTML CronoLab.
              </p>
              <p><button class="tutorial-inline-action" type="button" data-download-csv>Scarica il modello CSV</button></p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come si può condividere una linea?</summary>
            <div class="tutorial-answer">
              <p>
                Puoi inviare il file HTML, conservarlo in locale, pubblicarlo con un servizio che ospita pagine web
                oppure usare il PDF per stampa e distribuzione. Prima di condividere controlla
                <strong>diritti d’uso, fonti, dati personali, accessibilità</strong> e funzionamento dei link esterni.
              </p>
            </div>
          </details>
        </div>
      </section>

      <section class="tutorial-section" id="tutorial-didattica">
        <div class="tutorial-section-heading">
          <span class="tutorial-section-number">07</span>
          <h3>Uso didattico</h3>
        </div>
        <div class="tutorial-faq-list">
          <details class="tutorial-faq">
            <summary>Quale idea didattica c’è dietro CronoLab?</summary>
            <div class="tutorial-answer">
              <p>
                Una linea del tempo non serve soltanto a ricordare date: rende visibili <strong>successioni,
                durate, contemporaneità, cambiamenti e relazioni</strong>. Le capsule permettono di alternare
                informazioni, fonti e attività, così chi studia può ricostruire un percorso invece di leggere
                un semplice elenco cronologico.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come può essere usato CronoLab in classe?</summary>
            <div class="tutorial-answer">
              <ul>
                <li>Come supporto a una spiegazione, usando la modalità <strong>Presentazione</strong>.</li>
                <li>Per confrontare processi paralleli con categorie e <strong>Visione sincronica</strong>.</li>
                <li>Per un lavoro di gruppo in cui ogni gruppo cura una categoria, un periodo o alcune fonti.</li>
                <li>Per una verifica formativa, alternando contenuti ed esercizi con spiegazione.</li>
                <li>Per discutere attendibilità, selezione e citazione delle fonti.</li>
              </ul>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come può essere usato a casa?</summary>
            <div class="tutorial-answer">
              <p>
                Può diventare un percorso di studio autonomo, un ripasso tramite il Percorso essenziale oppure
                una consegna da completare e discutere in seguito. Se il file deve funzionare senza connessione,
                integra immagini e audio e non affidare informazioni indispensabili a video, mappe o link esterni.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come rendere la linea più accessibile e leggibile?</summary>
            <div class="tutorial-answer">
              <p>
                Usa testi alternativi per le immagini, titoli brevi, paragrafi chiari, un contrasto sufficiente
                tra testo e sfondo e collegamenti con etichette comprensibili. Non affidare un significato soltanto
                al colore. Evita capsule troppo dense e verifica che tastiera, schermo piccolo e PDF offrano
                comunque un percorso comprensibile.
              </p>
            </div>
          </details>

          <details class="tutorial-faq">
            <summary>Come posso segnalare un errore o chiedere informazioni?</summary>
            <div class="tutorial-answer">
              <p>
                Per segnalazioni, suggerimenti o richieste di informazioni puoi scrivere a
                <a href="mailto:tms.sereni@gmail.com">tms.sereni@gmail.com</a>.
                Se segnali un errore, indica possibilmente il browser usato e i passaggi che lo hanno prodotto.
              </p>
              <p>Le mappe utilizzano dati © OpenStreetMap contributors.</p>
            </div>
          </details>
        </div>
      </section>
    </article>
  </div>
</template>

        <span class="tutorial-release-badge">Versione attuale</span>
      </div>
      <h4>Editor e organizzazione</h4>
      <ul>
        <li>Aggiunti <strong>Annulla e Ripristina</strong>, con cronologia delle ultime 30 azioni.</li>
        <li>Riorganizzata la barra superiore e introdotto il menu <strong>Strumenti</strong>.</li>
        <li>Aggiunti <strong>Glossario</strong>, <strong>Controllo completezza</strong>, Apri un esempio e <strong>Percorso essenziale</strong>.</li>
        <li>Migliorati il selettore dei colori, la palette e i collegamenti tra capsule; aggiunta la funzione Ordina manualmente.</li>
      </ul>
      <h4>Contenuti e attività</h4>
      <ul>
        <li>Aggiunto il blocco <strong>Audio</strong>, con file, collegamento, registrazione e lettore dedicato.</li>
        <li>Esteso il blocco <strong>Immagine</strong> con carosello, griglie, confronto, didascalie in sovrimpressione e vista a tutto schermo.</li>
        <li>Aggiunti esercizi cloze, vero/falso, riordino e abbinamenti, oltre a suggerimenti e spiegazioni.</li>
        <li>Migliorati Luogo, mappe, Fonti, Collegamenti esterni e rimandi interni biunivoci.</li>
      </ul>
      <h4>Visualizzatore ed esportazione</h4>
      <ul>
        <li>Rinnovata la navigazione orizzontale e verticale, con ricerca, filtri, <strong>Presentazione</strong> e intestazione riducibile.</li>
        <li>Aggiunte <strong>Mappa di navigazione</strong> e <strong>Visione sincronica</strong> per categorie.</li>
        <li>Migliorate fasce dei periodi, domande bloccanti e visualizzazione del <strong>Percorso essenziale</strong>.</li>
        <li>Introdotta la funzione <strong>Esporta PDF</strong>, con linea multipagina, poster, Visione sincronica e controlli di leggibilità.</li>
        <li>Aggiunti logo, favicon e <strong>Tutorial</strong> in formato FAQ con pagina delle novità.</li>
      </ul>
